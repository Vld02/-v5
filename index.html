  function getTrainingItemKey(item) {
    return [item.timestamp || '', item.date || '', item.coach || '', item.place || '', item.fio || ''].join('|');
  }

  function getDistinctFilterValues(key) {
    if (isDateFilterKey(key)) {
      const set = new Set();
      trainingState.items.forEach(item => {
        const value = String(item[key] || '—').trim() || '—';
        set.add(value);
      });
      return [...set].sort((a, b) => a.localeCompare(b, 'ru'));
    }

    const counts = new Map();
    trainingState.items.forEach(item => {
      const values = getItemValuesForFilter(item, key);
      values.forEach(value => {
        counts.set(value, (counts.get(value) || 0) + 1);
      });
    });

    return [...counts.entries()]
      .sort((a, b) => {
        if (b[1] !== a[1]) return b[1] - a[1];
        return a[0].localeCompare(b[0], 'ru');
      })
      .map(([value]) => value);
  }

  function splitCoachValues(raw) {
    const value = String(raw || '').trim();
    if (!value) return ['—'];
    const parts = value.split(',').map(x => x.trim()).filter(Boolean);
    return parts.length ? parts : ['—'];
  }

  function getItemValuesForFilter(item, key) {
    if (key === 'coach') return splitCoachValues(item.coach);
    const value = String(item[key] || '—').trim() || '—';
    return [value];
  }

  function closeTrainingFilterMenu() {
    trainingState.activeFilterKey = '';
    collectActiveFilterDraft = null;
    trainingFilterMenu.classList.remove('show');
  }

  function isDateFilterKey(key) {
    return key === 'timestamp' || key === 'date';
  }

  function hasActiveFilter(key) {
    const filter = trainingState.filters[key];
    if (Array.isArray(filter)) return filter.length > 0;
    if (filter && typeof filter === 'object') {
      const hasRange = filter.start !== null || filter.end !== null;
      const hasValues = Array.isArray(filter.values);
      return hasRange || hasValues;
    }
    return false;
  }

  function getDistinctYearsForKey(key) {
    const years = new Set();
    trainingState.items.forEach(item => {
      const ts = parseRuDateTime(item[key]);
      if (ts === null) return;
      years.add(new Date(ts).getFullYear());
    });
    return [...years].sort((a, b) => a - b);
  }

  function getDateBoundsForKey(key) {
    let min = null;
    let max = null;
    trainingState.items.forEach(item => {
      const ts = parseRuDateTime(item[key]);
      if (ts === null) return;
      if (min === null || ts < min) min = ts;
      if (max === null || ts > max) max = ts;
    });
    return { min, max };
  }

  function formatDateInputFromTs(ts) {
    if (ts === null) return '';
    const d = new Date(ts);
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yyyy = String(d.getFullYear());
    return `${dd}.${mm}.${yyyy}`;
  }

  function parseDateFilterInput(value, isEnd) {
    const parsed = parseDateString(value);
    if (!parsed) return null;
    return buildDateTimestamp(parsed.year, parsed.month, parsed.day, isEnd);
  }

  function wireMaskedDateInput(inputEl) {
    inputEl.addEventListener('input', e => {
      const prevLen = e.target.value.length;
      const prevPos = e.target.selectionStart || 0;
      const digitsBefore = e.target.value.slice(0, prevPos).replace(/\D/g, '').length;
      const formatted = formatDateInput(e.target.value);
      e.target.value = formatted;

      let nextPos = formatted.length;
      let seenDigits = 0;
      for (let i = 0; i < formatted.length; i++) {
        if (/\d/.test(formatted[i])) seenDigits++;
        if (seenDigits >= digitsBefore) {
          nextPos = i + 1;
          break;
        }
      }

      if (formatted.length > prevLen && (formatted.length === 3 || formatted.length === 6)) {
        nextPos = formatted.length;
      }

      e.target.setSelectionRange(nextPos, nextPos);
    });
  }

  function buildDateTimestamp(year, month, day, isEnd) {
    if (!year) return null;
    const y = Number(year);
    const m = month ? Number(month) : (isEnd ? 12 : 1);
    const maxDay = new Date(y, m, 0).getDate();
    const d = day ? Number(day) : (isEnd ? maxDay : 1);
    const hh = isEnd ? 23 : 0;
    const mi = isEnd ? 59 : 0;
    const ss = isEnd ? 59 : 0;
    return new Date(y, m - 1, d, hh, mi, ss).getTime();
  }

  function setFilterMenuPosition(buttonEl) {
    const rect = buttonEl.getBoundingClientRect();
    const pageRect = document.querySelector('.page')?.getBoundingClientRect();

    trainingFilterMenu.classList.add('show');
    const menuRect = trainingFilterMenu.getBoundingClientRect();

    const minLeft = pageRect ? Math.max(8, pageRect.left + 4) : 8;
    const maxRight = pageRect ? pageRect.right - 4 : (document.documentElement.clientWidth - 8);
    const maxLeft = Math.max(minLeft, maxRight - menuRect.width);
    const preferredLeft = rect.left - 12;

    const minTop = 8;
    const maxBottom = pageRect ? Math.min(pageRect.bottom - 4, window.innerHeight - 8) : (window.innerHeight - 8);
    const openDownTop = rect.bottom + 4;
    const openUpTop = rect.top - menuRect.height - 4;
    let finalTop = openDownTop;
    if (openDownTop + menuRect.height > maxBottom && openUpTop >= minTop) {
      finalTop = openUpTop;
    }
    finalTop = Math.min(Math.max(finalTop, minTop), Math.max(minTop, maxBottom - menuRect.height));

    trainingFilterMenu.style.top = `${finalTop}px`;
    trainingFilterMenu.style.left = `${Math.min(Math.max(preferredLeft, minLeft), maxLeft)}px`;
  }

  function openTrainingFilterMenu(key, buttonEl) {
    const draft = trainingState.filterDrafts[key] || null;
    const allValues = getDistinctFilterValues(key);
    const baseFilter = draft ? draft.filter : trainingState.filters[key];
    const selected = Array.isArray(baseFilter)
      ? new Set(baseFilter)
      : (baseFilter && typeof baseFilter === 'object' && Array.isArray(baseFilter.values) && !isDateFilterKey(key)
        ? new Set(baseFilter.values)
        : new Set(allValues));

    trainingState.activeFilterKey = key;

    let localSortDir = typeof draft?.sortDir === 'number'
      ? draft.sortDir
      : (trainingState.sortKey === key ? trainingState.sortDir : 0);
    const sortAscActive = localSortDir === 1;
    const sortDescActive = localSortDir === -1;

    function saveDraft(filterValue) {
      const filterCopy = Array.isArray(filterValue)
        ? [...filterValue]
        : (filterValue && typeof filterValue === 'object'
          ? { ...filterValue, values: Array.isArray(filterValue.values) ? [...filterValue.values] : filterValue.values }
          : filterValue);
      trainingState.filterDrafts[key] = {
        filter: filterCopy,
        sortDir: localSortDir
      };
    }

    function toggleLocalSort(nextDir) {
      localSortDir = localSortDir === nextDir ? 0 : nextDir;
    }

    if (isDateFilterKey(key)) {
      const dateBounds = getDateBoundsForKey(key);
      const dateFilter = baseFilter && typeof baseFilter === 'object'
        ? baseFilter
        : { start: null, end: null, values: null };

      const selected = Array.isArray(dateFilter.values)
        ? new Set(dateFilter.values)
        : new Set(allValues);

      const defaultStartTs = dateBounds.min;
      const defaultEndTs = dateBounds.max;
      const startInputValue = formatDateInputFromTs(dateFilter.start !== null ? dateFilter.start : defaultStartTs);
      const endInputValue = formatDateInputFromTs(dateFilter.end !== null ? dateFilter.end : defaultEndTs);

      trainingFilterMenu.innerHTML = `
        <div class="training-filter-actions" style="margin-bottom:0.35rem;">
          <button type="button" data-action="sort-asc" class="${sortAscActive ? 'active' : ''}">А > Я</button>
          <button type="button" data-action="sort-desc" class="${sortDescActive ? 'active' : ''}">Я < А</button>
        </div>
        <div style="font-size:0.85rem;margin-bottom:0.25rem;">Дата начала</div>
        <input id="startDateInput" class="training-filter-search" type="text" inputmode="numeric" maxlength="10" placeholder="ДД.ММ.ГГГГ" value="${escapeHtml(startInputValue)}" />
        <div style="font-size:0.85rem;margin:0.35rem 0 0.25rem;">Дата конца</div>
        <input id="endDateInput" class="training-filter-search" type="text" inputmode="numeric" maxlength="10" placeholder="ДД.ММ.ГГГГ" value="${escapeHtml(endInputValue)}" />
        <div class="training-filter-actions" style="margin-top:0.35rem;">
          <button type="button" data-action="all">Все даты</button>
          <button type="button" data-action="reset">Сбросить</button>
        </div>
        <input class="training-filter-search" id="dateSearchInput" type="text" placeholder="Поиск дат..." />
        <div class="training-filter-options" id="dateOptions"></div>
        <div class="training-filter-actions" style="margin-top:0.35rem;">
          <button type="button" data-action="apply">Применить</button>
        </div>
      `;

      const startDateInput = trainingFilterMenu.querySelector('#startDateInput');
      const endDateInput = trainingFilterMenu.querySelector('#endDateInput');
      const dateSearchInput = trainingFilterMenu.querySelector('#dateSearchInput');
      const dateOptions = trainingFilterMenu.querySelector('#dateOptions');

      wireMaskedDateInput(startDateInput);
      wireMaskedDateInput(endDateInput);

      function getRangeFilteredValues() {
        const startTs = parseDateFilterInput(startDateInput.value, false);
        const endTs = parseDateFilterInput(endDateInput.value, true);
        const effectiveStart = startTs !== null ? startTs : defaultStartTs;
        const effectiveEnd = endTs !== null ? endTs : defaultEndTs;

        return allValues.filter(value => {
          const ts = parseRuDateTime(value);
          if (ts === null) return false;
          if (effectiveStart !== null && ts < effectiveStart) return false;
          if (effectiveEnd !== null && ts > effectiveEnd) return false;
          return true;
        });
      }

      function normalizeSelectedByRange() {
        const available = new Set(getRangeFilteredValues());
        [...selected].forEach(v => {
          if (!available.has(v)) selected.delete(v);
        });
      }

      function drawDateOptions(filterText = '') {
        const q = filterText.trim().toLowerCase();
        const rangeValues = getRangeFilteredValues();
        normalizeSelectedByRange();
        dateOptions.innerHTML = '';
        rangeValues
          .filter(v => !q || v.toLowerCase().includes(q))
          .forEach(v => {
            const id = `opt_${key}_${Math.random().toString(36).slice(2)}`;
            const label = document.createElement('label');
            label.className = 'training-filter-option';
            label.htmlFor = id;
            label.innerHTML = `<input id="${id}" type="checkbox" ${selected.has(v) ? 'checked' : ''}> ${escapeHtml(v)}`;
            const cb = label.querySelector('input');
            cb.addEventListener('change', () => {
              if (cb.checked) selected.add(v);
              else selected.delete(v);
              saveDraft({
                start: parseDateFilterInput(startDateInput.value, false),
                end: parseDateFilterInput(endDateInput.value, true),
                values: [...selected]
              });
            });
            dateOptions.appendChild(label);
          });
      }

      drawDateOptions();
      dateSearchInput.addEventListener('input', () => drawDateOptions(dateSearchInput.value));
      startDateInput.addEventListener('input', () => {
        selected.clear();
        getRangeFilteredValues().forEach(v => selected.add(v));
        drawDateOptions(dateSearchInput.value);
        saveDraft({
          start: parseDateFilterInput(startDateInput.value, false),
          end: parseDateFilterInput(endDateInput.value, true),
          values: [...selected]
        });
      });
      endDateInput.addEventListener('input', () => {
        selected.clear();
        getRangeFilteredValues().forEach(v => selected.add(v));
        drawDateOptions(dateSearchInput.value);
        saveDraft({
          start: parseDateFilterInput(startDateInput.value, false),
          end: parseDateFilterInput(endDateInput.value, true),
          values: [...selected]
        });
      });

      collectActiveFilterDraft = () => {
        saveDraft({
          start: parseDateFilterInput(startDateInput.value, false),
          end: parseDateFilterInput(endDateInput.value, true),
          values: [...selected]
        });
      };

      function applyDateFilter() {
        const startTs = parseDateFilterInput(startDateInput.value, false);
        const endTs = parseDateFilterInput(endDateInput.value, true);
        const rangeValues = getRangeFilteredValues();
        const selectedValues = (rangeValues.length > 0 && selected.size === rangeValues.length) ? null : [...selected];

        const effectiveStart = startTs !== null ? startTs : defaultStartTs;
        const effectiveEnd = endTs !== null ? endTs : defaultEndTs;
        const isDefaultRange = effectiveStart === defaultStartTs && effectiveEnd === defaultEndTs;

        if (isDefaultRange && !selectedValues) {
          trainingState.filters[key] = null;
        } else {
          trainingState.filters[key] = { start: effectiveStart, end: effectiveEnd, values: selectedValues };
        }
        if (localSortDir !== 0) {
          trainingState.sortKey = key;
          trainingState.sortDir = localSortDir;
        } else if (trainingState.sortKey === key) {
          trainingState.sortKey = '';
          trainingState.sortDir = 0;
        }
        delete trainingState.filterDrafts[key];
        closeTrainingFilterMenu();
        renderTrainingHistory(trainingState.items);
      }

      trainingFilterMenu.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        const target = e.target;
        if (!(target instanceof HTMLElement)) return;
        if (!target.closest('#startDateInput, #endDateInput, #dateSearchInput')) return;
        e.preventDefault();
        applyDateFilter();
      });

      trainingFilterMenu.querySelectorAll('button[data-action]').forEach(btn => {
        btn.addEventListener('click', () => {
          const action = btn.dataset.action;
          if (action === 'sort-asc') {
            toggleLocalSort(1);
            saveDraft({
              start: parseDateFilterInput(startDateInput.value, false),
              end: parseDateFilterInput(endDateInput.value, true),
              values: [...selected]
            });
            openTrainingFilterMenu(key, buttonEl);
          } else if (action === 'sort-desc') {
            toggleLocalSort(-1);
            saveDraft({
              start: parseDateFilterInput(startDateInput.value, false),
              end: parseDateFilterInput(endDateInput.value, true),
              values: [...selected]
            });
            openTrainingFilterMenu(key, buttonEl);
          } else if (action === 'all') {
            const rangeValues = getRangeFilteredValues();
            const isAllSelected = rangeValues.length > 0 && rangeValues.every(v => selected.has(v));
            if (isAllSelected) {
              rangeValues.forEach(v => selected.delete(v));
            } else {
              rangeValues.forEach(v => selected.add(v));
            }
            drawDateOptions(dateSearchInput.value);
            saveDraft({
              start: parseDateFilterInput(startDateInput.value, false),
              end: parseDateFilterInput(endDateInput.value, true),
              values: [...selected]
            });
          } else if (action === 'reset') {
            trainingState.filters[key] = null;
            delete trainingState.filterDrafts[key];
            openTrainingFilterMenu(key, buttonEl);
            renderTrainingHistory(trainingState.items);
          } else if (action === 'apply') {
            applyDateFilter();
          }
        });
      });
    } else {
      const isCoachFilter = key === 'coach';
      const initialMatchMode = (baseFilter && typeof baseFilter === 'object' && baseFilter.matchMode === 'and') ? 'and' : 'or';
      let localMatchMode = initialMatchMode;

      trainingFilterMenu.innerHTML = `
        <div class="training-filter-actions" style="margin-bottom:0.35rem;">
          <button type="button" data-action="sort-asc" class="${sortAscActive ? 'active' : ''}">А > Я</button>
          <button type="button" data-action="sort-desc" class="${sortDescActive ? 'active' : ''}">Я < А</button>
        </div>
        ${isCoachFilter ? `<div class="training-filter-actions" style="margin-bottom:0.35rem;"><button type="button" data-action="match-mode" class="active">${localMatchMode === 'and' ? 'И' : 'Или'}</button></div>` : ''}
        <input class="training-filter-search" type="text" placeholder="Поиск..." />
        <div class="training-filter-actions">
          <button type="button" data-action="all">Все</button>
          <button type="button" data-action="reset">Сбросить</button>
        </div>
        <div class="training-filter-options"></div>
        <div class="training-filter-actions" style="margin-top:0.35rem;">
          <button type="button" data-action="apply">Применить</button>
        </div>
      `;

      const search = trainingFilterMenu.querySelector('.training-filter-search');
      const optionsBox = trainingFilterMenu.querySelector('.training-filter-options');
      const matchModeBtn = trainingFilterMenu.querySelector('button[data-action="match-mode"]');

      function getFilterPayload() {
        const values = [...selected];
        if (!isCoachFilter) return values;
        return { values, matchMode: localMatchMode };
      }

      function drawOptions(filterText = '') {
        const q = filterText.trim().toLowerCase();
        optionsBox.innerHTML = '';
        allValues
          .filter(v => !q || v.toLowerCase().includes(q))
          .forEach(v => {
            const id = `opt_${key}_${Math.random().toString(36).slice(2)}`;
            const label = document.createElement('label');
            label.className = 'training-filter-option';
            label.htmlFor = id;
            label.innerHTML = `<input id="${id}" type="checkbox" ${selected.has(v) ? 'checked' : ''}> ${escapeHtml(v)}`;
            const cb = label.querySelector('input');
            cb.addEventListener('change', () => {
              if (cb.checked) selected.add(v);
              else selected.delete(v);
              saveDraft(getFilterPayload());
            });
            optionsBox.appendChild(label);
          });
      }

      drawOptions();
      search.addEventListener('input', () => drawOptions(search.value));
      trainingFilterMenu.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        const target = e.target;
        if (!(target instanceof HTMLElement)) return;
        if (!target.closest('.training-filter-search')) return;
        e.preventDefault();
        const applyBtn = trainingFilterMenu.querySelector('button[data-action="apply"]');
        if (applyBtn) applyBtn.click();
      });
      collectActiveFilterDraft = () => saveDraft(getFilterPayload());

      trainingFilterMenu.querySelectorAll('button[data-action]').forEach(btn => {
        btn.addEventListener('click', () => {
          const action = btn.dataset.action;
          if (action === 'sort-asc') {
            toggleLocalSort(1);
            saveDraft(getFilterPayload());
            openTrainingFilterMenu(key, buttonEl);
          } else if (action === 'sort-desc') {
            toggleLocalSort(-1);
            saveDraft(getFilterPayload());
            openTrainingFilterMenu(key, buttonEl);
          } else if (action === 'match-mode') {
            localMatchMode = localMatchMode === 'and' ? 'or' : 'and';
            if (matchModeBtn) {
              matchModeBtn.textContent = localMatchMode === 'and' ? 'И' : 'Или';
            }
            saveDraft(getFilterPayload());
          } else if (action === 'all') {
            const isAllSelected = allValues.length > 0 && allValues.every(v => selected.has(v));
            if (isAllSelected) selected.clear();
            else allValues.forEach(v => selected.add(v));
            drawOptions(search.value);
            saveDraft(getFilterPayload());
          } else if (action === 'reset') {
            selected.clear();
            drawOptions(search.value);
            saveDraft(getFilterPayload());
          } else if (action === 'apply') {
            const allSelected = selected.size === allValues.length;
            if (allSelected && (!isCoachFilter || localMatchMode === 'or')) {
              trainingState.filters[key] = null;
            } else if (isCoachFilter) {
              trainingState.filters[key] = { values: [...selected], matchMode: localMatchMode };
            } else {
              trainingState.filters[key] = [...selected];
            }
            if (localSortDir !== 0) {
              trainingState.sortKey = key;
              trainingState.sortDir = localSortDir;
            } else if (trainingState.sortKey === key) {
              trainingState.sortKey = '';
              trainingState.sortDir = 0;
            }
            delete trainingState.filterDrafts[key];
            closeTrainingFilterMenu();
            renderTrainingHistory(trainingState.items);
          }
        });
      });
    }

    setFilterMenuPosition(buttonEl);
  }

  function parseRuDateTime(value) {
    const str = String(value || '').trim();
    const m = str.match(/^(\d{2})\.(\d{2})\.(\d{4})(?:\s+(\d{2}):(\d{2}):(\d{2}))?$/);
    if (!m) return null;
    const dd = Number(m[1]);
    const mm = Number(m[2]) - 1;
    const yyyy = Number(m[3]);
    const hh = Number(m[4] || 0);
    const mi = Number(m[5] || 0);
    const ss = Number(m[6] || 0);
    return new Date(yyyy, mm, dd, hh, mi, ss).getTime();
  }

  function getSortedTrainingItems(items) {
    const filtered = items.filter(item => {
      return ['timestamp', 'date', 'coach', 'place'].every(key => {
        const filter = trainingState.filters[key];
        if (!filter) return true;

        if (Array.isArray(filter)) {
          const values = getItemValuesForFilter(item, key);
          return values.some(v => filter.includes(v));
        }

        if (key === 'coach' && filter && typeof filter === 'object' && Array.isArray(filter.values)) {
          const values = getItemValuesForFilter(item, key);
          const selectedValues = filter.values;
          if (!selectedValues.length) return false;
          if (filter.matchMode === 'and') {
            return selectedValues.every(v => values.includes(v));
          }
          return selectedValues.some(v => values.includes(v));
        }

        if (isDateFilterKey(key) && typeof filter === 'object') {
          const value = String(item[key] || '—').trim() || '—';
          if (Array.isArray(filter.values) && !filter.values.includes(value)) return false;

          const ts = parseRuDateTime(item[key]);
          if (ts === null) return false;
          if (filter.start !== null && ts < filter.start) return false;
          if (filter.end !== null && ts > filter.end) return false;
          return true;
        }

        return true;
      });
    });

    if (!trainingState.sortKey || trainingState.sortDir === 0) return [...filtered];

    const dir = trainingState.sortDir;
    const key = trainingState.sortKey;

    return [...filtered].sort((a, b) => {
      if (key === 'timestamp' || key === 'date') {
        const at = parseRuDateTime(a[key]);
        const bt = parseRuDateTime(b[key]);
        if (at !== null && bt !== null && at !== bt) return at > bt ? dir : -dir;
      }

      const av = String(a[key] || '').toLowerCase();
      const bv = String(b[key] || '').toLowerCase();
      if (av === bv) return 0;
      return av > bv ? dir : -dir;
    });
  }

  function updateTrainingSortUi() {
    trainingSortButtons.forEach(btn => {
      const active = btn.dataset.sortKey === trainingState.sortKey && trainingState.sortDir !== 0;
      btn.classList.toggle('active', active);
      let mark = '';
      if (active) mark = trainingState.sortDir === 1 ? '↑' : '↓';
      btn.setAttribute('data-sort-mark', mark);
    });

  }

  function preserveViewportOnCollapse(beforeY) {
    requestAnimationFrame(() => {
      const afterY = window.scrollY;
      if (afterY < beforeY) {
        window.scrollTo(0, beforeY);
      }
    });
  }

  function renderTrainingHistory(items) {
    trainingList.innerHTML = '';

    const maxCount = getMaxVisibleCount();
    trainingVisibleCountInput.max = String(maxCount);
    if (trainingState.visibleCount > maxCount) {
      trainingState.visibleCount = maxCount;
      trainingVisibleCountInput.value = String(maxCount);
    }

    if (!items || !items.length) {
      trainingList.innerHTML = '<div class="placeholder" style="padding:0.75rem 0.6rem;font-size:1rem;">История тренировок не найдена.</div>';
      updateTrainingSortUi();
      return;
    }

    const sorted = getSortedTrainingItems(items);

    if (!sorted.length) {
      trainingList.innerHTML = '<div class="placeholder" style="padding:0.75rem 0.6rem;font-size:1rem;">История тренировок не найдена.</div>';
      updateTrainingSortUi();
      return;
    }

    const limitedItems = sorted.slice(0, trainingState.visibleCount);

    limitedItems.forEach(item => {
      const card = document.createElement('div');
      card.className = 'training-item';

      const itemKey = getTrainingItemKey(item);

      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'training-toggle';
      const coachLinesHtml = splitCoachValues(item.coach)
        .map(v => escapeHtml(v))
        .join('<br>');
      toggle.innerHTML = `<span>${escapeHtml(item.date || '')}</span><span>${coachLinesHtml}</span><span>${escapeHtml(item.place || '')}</span>`;

      const isOpen = trainingState.opened.has(itemKey);
      card.classList.toggle('open', isOpen);
      toggle.setAttribute('aria-expanded', String(isOpen));

      const fio = document.createElement('div');
      fio.className = 'training-fio-list';

      const groupsWrap = document.createElement('div');
      groupsWrap.className = 'training-fio-groups';

      const groups = Array.isArray(item.fioGroups) ? item.fioGroups : [];
      if (!groups.length) {
        groupsWrap.textContent = item.fio || '—';
      } else {
        groups.forEach(groupItem => {
          const col = document.createElement('div');
          col.className = 'training-fio-group';

          const title = document.createElement('div');
          title.className = 'training-fio-group-title';
          title.textContent = groupItem.group || NO_GROUP_LABEL;

          col.appendChild(title);

          (groupItem.names || []).forEach(name => {
            const row = document.createElement('div');
            row.className = 'training-fio-name';
            row.textContent = name;
            col.appendChild(row);
          });

          groupsWrap.appendChild(col);
        });
      }

      const timestampMeta = document.createElement('div');
      timestampMeta.className = 'training-meta-timestamp';
      timestampMeta.textContent = `Отметка времени: ${item.timestamp || '—'}`;

      fio.appendChild(timestampMeta);
      fio.appendChild(groupsWrap);

      card.appendChild(toggle);
      card.appendChild(fio);

      toggle.addEventListener('click', () => {
        const beforeY = window.scrollY;
        const willOpen = !card.classList.contains('open');
        card.classList.toggle('open', willOpen);
        toggle.setAttribute('aria-expanded', String(willOpen));
        if (willOpen) trainingState.opened.add(itemKey);
        else {
          trainingState.opened.delete(itemKey);
          preserveViewportOnCollapse(beforeY);
        }
      });

      trainingList.appendChild(card);
    });

    updateTrainingSortUi();
  }

  function loadTrainingHistory(force = false) {
    if (!force && trainingState.isLoaded) {
      setTrainingSyncState('idle');
      return;
    }

    const requestId = ++trainingState.requestId;
    setTrainingSyncState('loading');

    google.script.run
      .withSuccessHandler(items => {
        if (requestId !== trainingState.requestId) return;
        trainingState.items = Array.isArray(items) ? items : [];
        trainingState.isLoaded = true;
        saveTrainingHistoryCache(trainingState.items);
        renderTrainingHistory(trainingState.items);
        setTrainingSyncState('success');
      })
      .withFailureHandler(() => {
        if (requestId !== trainingState.requestId) return;
        setTrainingSyncState('idle');
      })
      .getTrainingHistory();
  }

  trainingSortButtons.forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const key = btn.dataset.sortKey;
      if (trainingState.activeFilterKey === key && trainingFilterMenu.classList.contains('show')) {
        closeTrainingFilterMenu();
        return;
      }
      openTrainingFilterMenu(key, btn);
    });
  });

  document.addEventListener('mousedown', e => {
    if (!trainingFilterMenu.classList.contains('show')) return;
    if (trainingFilterMenu.contains(e.target)) return;
    if (e.target instanceof Element && e.target.closest('.training-sort')) return;
    if (typeof collectActiveFilterDraft === 'function') {
      collectActiveFilterDraft();
    }
    closeTrainingFilterMenu();
  });

  function getMaxVisibleCount() {
    return Math.max(1, trainingState.items.length || 1);
  }

  function applyVisibleCountFromInput() {
    const maxCount = getMaxVisibleCount();
    trainingVisibleCountInput.max = String(maxCount);
    const parsed = Number.parseInt(trainingVisibleCountInput.value, 10);
    const fallback = Math.min(5, maxCount);
    const safeValue = Number.isFinite(parsed)
      ? Math.min(Math.max(parsed, 1), maxCount)
      : fallback;
    trainingState.visibleCount = safeValue;
    trainingVisibleCountInput.value = String(safeValue);
    renderTrainingHistory(trainingState.items);
  }

  trainingVisibleCountInput.addEventListener('blur', applyVisibleCountFromInput);
  trainingVisibleCountInput.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    trainingVisibleCountInput.blur();
  });

  function setTrainingView(view) {
    const isTable = view === 'table';
    trainingState.view = isTable ? 'table' : 'list';
    trainingListView.classList.toggle('hidden', isTable);
    trainingTableView.classList.toggle('hidden', !isTable);
    trainingViewListBtn.classList.toggle('active', !isTable);
    trainingViewTableBtn.classList.toggle('active', isTable);
    trainingVisibleCountWrap.classList.toggle('hidden', isTable);
    renderTrainingActionButton();
  }

  trainingViewListBtn.addEventListener('click', () => setTrainingView('list'));
  trainingViewTableBtn.addEventListener('click', () => setTrainingView('table'));
  trainingSyncButton.addEventListener('click', () => {
    if (trainingState.view === 'table') {
      window.open(TRAINING_SHEET_URL, '_blank', 'noopener');
      return;
    }

    loadTrainingHistory(true);
  });

  function renderResult(row, data) {
    const rowId = getRowId(row);
    const rowState = ensureAttendanceState(rowId);
    const cell = row.cells[1];
    cell.innerHTML = '';

    if (!data || !data.options || data.options.length === 0 || data.options.length > 3) {
      rowState.options = [];
      rowState.selectedFio = '';
      rowState.selectionMode = 'auto';
      cell.innerText = '—';
      return;
    }

    rowState.options = [...data.options];

    const hasManualSelection = rowState.selectionMode === 'manual'
      && rowState.options.includes(rowState.selectedFio);
    const selectedValue = hasManualSelection
      ? rowState.selectedFio
      : (rowState.options.includes(data.selected) ? data.selected : '');

    rowState.selectedFio = selectedValue;
    rowState.selectionMode = hasManualSelection ? 'manual' : 'auto';

    const wrap = document.createElement('div');
    wrap.className = 'fio-list';

    rowState.options.forEach(fio => {
      const btn = document.createElement('div');
      btn.className = 'fio-option';
      btn.innerText = fio;
      if (fio === selectedValue) btn.classList.add('selected');

      btn.addEventListener('click', () => {
        const previousFio = rowState.selectedFio;
        [...wrap.children].forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        rowState.selectedFio = fio;
        rowState.selectionMode = 'manual';

        if (previousFio && previousFio !== fio) {
          logEventClient('fio_change', { oldFio: previousFio, fio });
        } else if (previousFio !== fio) {
          logEventClient('fio_select', { fio });
        }
      });

      wrap.appendChild(btn);
    });

    cell.appendChild(wrap);
  }

  function runMatch() {
    const rows = [...tbody.rows];
    const changedRows = [];

    rows.forEach(row => {
      const rowId = getRowId(row);
      const rowState = ensureAttendanceState(rowId);
      const input = normalizeAttendanceInput(row.cells[0].innerText);
      if (rowState.lastMatchedInput !== input) {
        changedRows.push({ row, rowState, input });
      }
    });

    if (!changedRows.length) return Promise.resolve();

    const inputs = changedRows.map(item => item.input);

    matchInFlight = true;

    return new Promise(resolve => {
      google.script.run
        .withSuccessHandler(results => {
          results.forEach((data, i) => {
            const changed = changedRows[i];
            if (!changed || !changed.row.isConnected) return;

            renderResult(changed.row, data);
            changed.rowState.lastMatchedInput = changed.input;
          });
          matchInFlight = false;
          resolve();
        })
        .withFailureHandler(() => {
          matchInFlight = false;
          resolve();
        })
        .findNames(inputs);
    });
  }

  hydrateExistingRows();
  const hasCachedTrainingHistory = restoreTrainingHistoryCache();
  loadTrainingHistory(hasCachedTrainingHistory);
  async function openAttendanceForm() {
    if (debounceTimer) {
      clearTimeout(debounceTimer);
      debounceTimer = null;
      latestMatchPromise = runMatch();
    }

    if (matchInFlight) {
      await latestMatchPromise;
    }

    const rows = [...tbody.rows];
    const hasUnselectedRows = rows.some(r => {
      const options = r.querySelectorAll('.fio-option');
      if (!options.length) return false;
      return !r.querySelector('.fio-option.selected');
    });

    if (hasUnselectedRows) {
      logEventClient('user_warning', { message: 'Выберите все ФИО' });
      showAttendanceNotice('Выберите все ФИО');
      return;
    }

    const values = getAttendanceSelectedValues();

    localStorage.setItem(ATTENDANCE_DRAFT_DELETE_AFTER_KEY, String(Date.now() + ATTENDANCE_DRAFT_TTL_MS));

    logFillFormClickClient();

    const prefillValue = encodeURIComponent(values.join('\n'));
    const url = `${CLIENT_CONFIG.urls.attendanceForm}=${prefillValue}`;
    window.open(url, '_blank');
  }
</script>
