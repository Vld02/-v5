  html {
    font-size: var(--base-font-size);
  }

  @media (min-width: 52.0625em) and (pointer: fine) {
    html {
      font-size: calc(var(--base-font-size) * 0.47);
    }
  }

  body {
    font-family: Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.35;
    margin: 0;
    padding: 0;
    background-image: var(--app-bg-image);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    overflow-x: hidden;
  }

  .page {
    max-width: var(--page-max-width);
    width: min(var(--page-max-width), calc(100vw - var(--space-lg) * 2));
    box-sizing: border-box;
    margin: calc(var(--topbar-height) + var(--space-lg)) auto var(--space-lg);
    padding: var(--space-lg);
    background: var(--card-bg);
    border-radius: var(--radius-lg);
  }

  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10000;
    height: var(--topbar-height);
    display: flex;
    align-items: center;
    gap: var(--space-md);
    box-sizing: border-box;
    padding: 0 var(--space-lg);
    background: rgba(255, 255, 255, 0.9);
    box-shadow: 0 0.15rem 0.8rem rgba(0, 0, 0, 0.18);
    backdrop-filter: blur(0.35rem);
  }




  .topbar-tabs {
    min-width: 0;
    display: flex;
    align-items: stretch;
    gap: var(--space-sm);
    overflow-x: auto;
    scrollbar-width: thin;
  }

  .topbar-tab {
    margin: 0;
    padding: 0.45em 0.8em;
    border: none;
    border-radius: var(--radius-md);
    background: transparent;
    color: #222;
    font-weight: 700;
    white-space: nowrap;
  }

  .topbar-tab:hover,
  .topbar-tab:focus-visible {
    background: rgba(26, 115, 232, 0.1);
    outline: none;
  }

  .topbar-tab.active {
    background: #e7f0ff;
    color: var(--primary);
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .section-heading { display: none; }

  h2 { text-align: center; font-size: clamp(1.35rem, 1rem + 1vw, 2rem); }
  label { display: block; margin-top: var(--space-md); }
  input { padding: 0.65em 0.75em; margin: var(--space-sm) 0; width: 100%; box-sizing: border-box; font: inherit; }
  button { padding: 0.7em 1.1em; margin-top: var(--space-md); cursor: pointer; font: inherit; }

  .item { display: flex; border: 0.05rem solid #d8d8d8; border-top: none; min-height: 2.2rem; }
  .item:first-of-type { border-top: 0.05rem solid #d8d8d8; }
  .item-title { font-weight: bold; width: 45%; padding: var(--space-sm); background:#f7f7f7; border-right:0.05rem solid #d8d8d8; display:flex; align-items:center; }
  .item-value { width: 55%; padding: var(--space-sm); position: relative; min-height: 2.2rem; }
  .parent-section { margin-top:1rem; }
  .parent-section-header {
    width:100%;
    margin:0 0 0.5rem;
    padding:0 0 0.35rem;
    border:0;
    border-bottom:0.1rem solid #000;
    background:transparent;
    color:inherit;
    font:inherit;
    font-weight:bold;
    font-size:1.2rem;
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0.75rem;
    cursor:pointer;
  }
  .parent-section-header:hover { background:#f7f7f7; }
  .parent-section-toggle { margin-left:auto; font-weight:normal; opacity:0.75; }
  .parent-section-title { flex:1; }
  .parent-section-content[hidden] { display:none; }
  .cell-edit-shell { position:relative; min-height:2rem; padding-right:calc(1.55rem + var(--space-xs)); }
  .cell-edit-actions { position:absolute; top:50%; right:calc(-1 * var(--space-sm)); width:1.55rem; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; transform:translateY(-50%); }
  .cell-edit-btn { width:1.55rem; height:1.55rem; min-width:1.55rem; min-height:1.55rem; max-width:1.55rem; max-height:1.55rem; flex:0 0 1.55rem; padding:0; display:inline-flex; align-items:center; justify-content:center; overflow:visible; color:inherit; line-height:1; }

<header class="topbar">

</header>

  </div>
</div>

<div class="page">
  <section id="tab-docs" class="tab-panel active">
    <h2 class="section-heading">ДБВv5 Документы</h2>

    <input id="login" type="text" placeholder="Фамилия Имя Отчество" />

    <div id="result"></div>

      <div class="attendance-toolbar-group">

      </div>

      </div>

          <tr>
            <th>Сокращённое ФИО</th>

          </tr>
        </thead>
        <tbody>

<script>
  /*************************************************
   * ОБЩИЕ DOM-ССЫЛКИ И НАВИГАЦИЯ ПО ВКЛАДКАМ
   *************************************************/
  const dom = {
    error: document.getElementById('error'),
    loading: document.getElementById('loading'),
    login: document.getElementById('login'),
    password: document.getElementById('password'),
    snils: document.getElementById('snils'),
    snilsWrap: document.getElementById('snilsWrap'),
    toastContainer: document.getElementById('toastContainer'),
    attachmentModal: document.getElementById('attachmentModal'),
    attachmentModalTitle: document.getElementById('attachmentModalTitle'),
    attachmentCurrent: document.getElementById('attachmentCurrent'),
    attachmentFileInput: document.getElementById('attachmentFileInput'),
    attachmentDropzone: document.getElementById('attachmentDropzone'),
    attachmentFileInfo: document.getElementById('attachmentFileInfo'),
    attachmentError: document.getElementById('attachmentError'),
    attachmentCancel: document.getElementById('attachmentCancel'),
    attachmentUpload: document.getElementById('attachmentUpload')
  };

  const topbarTabs = [...document.querySelectorAll('.topbar-tab')];

  const tabPanels = {
    docs: document.getElementById('tab-docs'),
    attendance: document.getElementById('tab-attendance'),
    gear: document.getElementById('tab-gear')
  };
  const ACTIVE_TAB_STORAGE_KEY = 'activeTab';
  const ATTENDANCE_ROWS_STORAGE_KEY = 'attendanceRowsDraftV1';
  const ATTENDANCE_DRAFT_DELETE_AFTER_KEY = 'attendanceDraftDeleteAfterAtV1';
  const ATTENDANCE_DRAFT_TTL_MS = 30 * 60 * 1000;
  const LAST_SILENT_SYNC_KEY = 'lastSilentSyncAt';
  const SILENT_SYNC_INTERVAL_MS = 15 * 60 * 1000;
  const TRAINING_HISTORY_STORAGE_KEY = 'trainingHistoryItemsV1';
  const TRAINING_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1K1TtjIL2retzFoXBlQaePKbeKIEkMZZedZX-Ans4VjY/edit?usp=sharing';

  /* ============================================================
   КОНФИГУРАЦИЯ РЕДАКТИРОВАНИЯ НА КЛИЕНТЕ

   Единственный источник истины находится на сервере в Code.gs:
   EDIT_CONFIG.rules и EDIT_CONFIG.fields. Браузер хранит только
   полученную копию в editConfig, чтобы построить интерфейс, подсказки,
   плейсхолдеры и клиентскую проверку для удобства пользователя.

   ВАЖНО: эту копию можно изменить через DevTools, поэтому она не
   является защитой. updateResultCell() всегда заново проверяет
   поле и значение по серверному EDIT_CONFIG.
   ============================================================ */
  let editConfig = null;
  let editConfigPromise = null;

  function loadEditConfig() {
    if (editConfig) return Promise.resolve(editConfig);
    if (editConfigPromise) return editConfigPromise;

    editConfigPromise = new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(config => {
          editConfig = config || { rules: {}, fields: {}, attachments: {} };
          resolve(editConfig);
        })
        .withFailureHandler(error => {
          editConfigPromise = null;
          reject(error);
        })
        .getEditConfig();
    });

    return editConfigPromise;
  }

  let currentDocsRow = { header: [], row: [], colors: [] };

  loadEditConfig().catch(() => {});

  function getFieldEditRule(headerTitle) {
    if (!editConfig) {
      return { editable: false, rule: 'TEXT', required: false, isIdentityField: false, regex: '^.*$', special: '', placeholder: '', ruleKey: 'TEXT' };
    }

    const fieldConfig = editConfig.fields[headerTitle] || { editable: false, rule: 'TEXT', required: false, isIdentityField: false };
    const editRule = editConfig.rules[fieldConfig.rule] || editConfig.rules.TEXT || { regex: '^.*$', special: '', placeholder: '' };
    return { ...editRule, ...fieldConfig, ruleKey: fieldConfig.rule };
  }

  function applyInputSpecial(rawValue, rule) {
    const value = String(rawValue || '');
    if (!rule || !rule.special) return value;
    if (rule.special === 'date') return formatDateInput(value);
    if (rule.special === 'year') return value.replace(/\D/g, '').slice(0, 4);
    if (rule.special === 'classCourse') return value.toUpperCase().replace(/[^0-9IV]/g, '').slice(0, 2);
    if (rule.special === 'singleRuUpper') {
      const onlyRu = value.toUpperCase().replace(/[^А-ЯЁ]/g, '');
      return onlyRu.slice(0, 1);
    }
    if (rule.special === 'email') return value.replace(/[А-Яа-яЁё]/g, '');
    if (rule.special === 'snils') return formatSnilsInput(value);
    if (rule.special === 'passportRu') return formatPassportRuInput(value);
    if (rule.special === 'passportDivisionCode') return formatPassportDivisionCodeInput(value);
    if (rule.special === 'medPolicyNumber') return formatMedPolicyNumberInput(value);
    if (rule.special === 'mgfsoId') return value.replace(/\D/g, '').slice(0, 7);
    if (rule.special === 'phoneRu') {
      const raw = value.trim();
      const digits = raw.replace(/\D/g, '');
      let normalizedDigits = digits;
      if (raw.startsWith('+')) {
        normalizedDigits = digits.startsWith('7') ? digits.slice(1) : digits;
      } else if (raw.startsWith('8') || raw.startsWith('7')) {
        normalizedDigits = digits.slice(1);
      }
      normalizedDigits = normalizedDigits.slice(0, 11);
      const countryAndBody = (`7${normalizedDigits}`).slice(0, 12);
      const body = countryAndBody.slice(1);
      const p1 = body.slice(0, 3);
      const p2 = body.slice(3, 6);
      const p3 = body.slice(6, 8);
      const p4 = body.slice(8, 10);
      let formatted = '+7';
      if (p1) formatted += ` ${p1}`;
      if (p2) formatted += ` ${p2}`;
      if (p3) formatted += `-${p3}`;
      if (p4) formatted += `-${p4}`;
      return formatted;
    }
    if (rule.special === 'certificate') {
      let raw = value.toUpperCase().replace(/[^VIXА-ЯЁ0-9№#\\-\\s]/g, '');
      raw = raw.replace(/#/g, '№');
      const roman = (raw.match(/[VIX]/g) || []).join('').slice(0, 4);
      const letters = raw.replace(/[^А-ЯЁ]/g, '').slice(0, 3);
      const digits = raw.replace(/\D/g, '').slice(0, 6);
      let formatted = roman;
      if (roman && letters) formatted += `-${letters}`;
      if (roman && letters && digits) formatted += ` № ${digits}`;
      return formatted;
    }
    return value;
  }


  function formatPassportRuInput(value) {
    const digits = String(value || '').replace(/\D/g, '').slice(0, 10);
    const seriesA = digits.slice(0, 2);
    const seriesB = digits.slice(2, 4);
    const number = digits.slice(4, 10);
    let formatted = seriesA;
    if (seriesB) formatted += ` ${seriesB}`;
    if (number) formatted += ` ${number}`;
    return formatted;
  }

  function formatPassportDivisionCodeInput(value) {
    const digits = String(value || '').replace(/\D/g, '').slice(0, 6);
    const first = digits.slice(0, 3);
    const second = digits.slice(3, 6);
    return second ? `${first}-${second}` : first;
  }

  function formatMedPolicyNumberInput(value) {
    const digits = String(value || '').replace(/\D/g, '').slice(0, 16);
    return digits.match(/.{1,4}/g)?.join(' ') || '';
  }

  function getMaxEnrollmentYear() {
    return new Date().getFullYear() + 1;
  }

  function isEnrollmentYearInRange(value) {
    const year = Number(value);
    return Number.isInteger(year) && year >= 1950 && year <= getMaxEnrollmentYear();
  }

  function isValidRuDate(value) {
    const match = String(value || '').match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
    if (!match) return false;

    const day = Number(match[1]);
    const month = Number(match[2]);
    const year = Number(match[3]);

    if (month < 1 || month > 12) return false;
    if (day < 1) return false;

    const daysInMonth = new Date(year, month, 0).getDate();
    return day <= daysInMonth;
  }

  function isValidFieldValue(trimmedValue, rule) {
    const value = String(trimmedValue || '');
    if (value === '') return !rule.required;
    if (!new RegExp(rule.regex).test(value)) return false;
    if (rule.special === 'year') return isEnrollmentYearInRange(value);
    if (rule.special === 'date') return isValidRuDate(value);
    return true;
  }

  function showToast(message, type = 'success') {
    const toast = document.createElement('div');
    toast.className = `toast ${type === 'error' ? 'error' : 'success'}`;
    toast.textContent = message;
    dom.toastContainer.appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
  }

  function updateCurrentIdentityAfterSave(columnName, value) {
    if (columnName === 'Фамилия Имя Отчество (С)') {
      dom.login.value = value;
    } else if (columnName === 'Дата рождения (С)') {
      dom.password.value = value;
    } else if (columnName === 'Снилс: номер') {
      dom.snils.value = formatSnilsInput(value);
    }
    saveAuthInputs(dom.login.value.trim(), dom.password.value.trim(), dom.snils.value.trim());
  }

  function filterSuggestions(query, options) {
    const normalizedQuery = String(query || '').trim().toLowerCase().replace(/ё/g, 'е');
    const uniq = [...new Set((options || []).map(v => String(v || '').trim()).filter(Boolean))];
    if (!normalizedQuery) return uniq.slice(0, 10);
    const starts = [];
    const includes = [];
    uniq.forEach(value => {
      const normalizedValue = value.toLowerCase().replace(/ё/g, 'е');
      if (normalizedValue.startsWith(normalizedQuery)) {
        starts.push({ value, pos: 0, len: normalizedValue.length });
      } else {
        const pos = normalizedValue.indexOf(normalizedQuery);
        if (pos >= 0) includes.push({ value, pos, len: normalizedValue.length });
      }
    });
    includes.sort((a, b) => a.pos - b.pos || a.len - b.len || a.value.localeCompare(b.value, 'ru'));
    starts.sort((a, b) => a.len - b.len || a.value.localeCompare(b.value, 'ru'));
    return starts.concat(includes).map(item => item.value).slice(0, 10);
  }

  function switchTab(key) {
    if (!tabPanels[key]) return;
    const currentTab = localStorage.getItem(ACTIVE_TAB_STORAGE_KEY);
    if (currentTab !== key) logSectionVisitClient(key);
    topbarTabs.forEach(btn => {
      const isActive = btn.dataset.tab === key;
      btn.classList.toggle('active', isActive);
      btn.toggleAttribute('aria-current', isActive);
    });
    Object.entries(tabPanels).forEach(([name, panel]) => {
      panel.classList.toggle('active', name === key);
    });
    localStorage.setItem(ACTIVE_TAB_STORAGE_KEY, key);
  }


  topbarTabs.forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  const savedTab = localStorage.getItem(ACTIVE_TAB_STORAGE_KEY);
  if (savedTab && tabPanels[savedTab]) {
    switchTab(savedTab);
  }

  /*************************************************
   * ДОКУМЕНТЫ: РАБОТА С ДАТОЙ И АВТОРИЗАЦИЯ
   *************************************************/
  const authState = {
    awaitingSnils: false,
    login: '',
    password: ''
  };
  let authLoadingTimer = null;
  let authLoadingBaseText = '';

  function startAuthLoading(baseText) {
    stopAuthLoading();
    authLoadingBaseText = baseText;
    let dots = 0;
    dom.loading.innerText = authLoadingBaseText;
    authLoadingTimer = setInterval(() => {
      dots = (dots + 1) % 4;
      dom.loading.innerText = `${authLoadingBaseText}${'.'.repeat(dots)}`;
    }, 450);
  }

  function stopAuthLoading() {
    if (authLoadingTimer) {
      clearInterval(authLoadingTimer);
      authLoadingTimer = null;
    }
    dom.loading.innerText = '';
  }

  function formatSnilsInput(value) {
    const digits = (value || '').replace(/\D/g, '').slice(0, 11);
    if (digits.length <= 3) return digits;
    if (digits.length <= 6) return `${digits.slice(0, 3)}-${digits.slice(3)}`;
    if (digits.length <= 9) return `${digits.slice(0, 3)}-${digits.slice(3, 6)}-${digits.slice(6)}`;
    return `${digits.slice(0, 3)}-${digits.slice(3, 6)}-${digits.slice(6, 9)}-${digits.slice(9)}`;
  }

  function hideSnilsStep() {
    authState.awaitingSnils = false;
    authState.login = '';
    authState.password = '';
    dom.snilsWrap.style.display = 'none';
  }

  function startSnilsStep(login, password) {
    authState.awaitingSnils = true;
    authState.login = login;
    authState.password = password;

    const savedSnils = localStorage.getItem('savedSnils');
    if (savedSnils && !dom.snils.value.trim()) {
      dom.snils.value = formatSnilsInput(savedSnils);
    }

    dom.snilsWrap.style.display = 'block';
    dom.snils.focus();
    stopAuthLoading();
  }

  function saveAuthInputs(loginVal, dateVal, snilsVal) {
    localStorage.setItem('savedLogin', loginVal);
    localStorage.setItem('savedDate', dateVal);
    localStorage.setItem('savedSnils', snilsVal);
  }

  function parseDateString(value) {
    if (!value) return null;
    value = value.trim();
    const isoMatch = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (isoMatch) return { year: isoMatch[1], month: String(Number(isoMatch[2])), day: String(Number(isoMatch[3])) };
    const dotMatch = value.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
    if (dotMatch) return { year: dotMatch[3], month: String(Number(dotMatch[2])), day: String(Number(dotMatch[1])) };
    return null;
  }

  function expandShortYear(yearToken) {
    if (!/^\d{2}$/.test(yearToken)) return yearToken;
    const yearNumber = Number(yearToken);
    return String(yearNumber >= 50 ? 1900 + yearNumber : 2000 + yearNumber);
  }

  function formatDateInput(value, { finalizeYear = false } = {}) {
    const raw = String(value || '').trim();
    const hasTrailingSeparator = /[\s.,-]$/.test(raw);
    const parts = raw
      .split(/[\s.,-]+/)
      .filter(Boolean)
      .slice(0, 3)
      .map(part => part.replace(/\D/g, ''));

    let day = parts[0] || '';
    let month = parts[1] || '';
    let year = parts[2] || '';

    if (day.length > 2) {
      month = (day.slice(2) + month).slice(0, 2);
      day = day.slice(0, 2);
    }

    if (month.length > 2) {
      year = (month.slice(2) + year).slice(0, 4);
      month = month.slice(0, 2);
    }

    if (year.length > 4) year = year.slice(0, 4);

    if (day.length === 1 && (month || hasTrailingSeparator)) day = day.padStart(2, '0');
    if (month.length === 1 && (year || hasTrailingSeparator)) month = month.padStart(2, '0');

    if ((finalizeYear && year.length === 2) || (hasTrailingSeparator && year.length === 2)) {
      year = expandShortYear(year);
    }

    return [day, month, year].filter(Boolean).join('.');
  }

  const DATE_MASK_DIGIT_POSITIONS = Object.freeze([0, 1, 3, 4, 6, 7, 8, 9]);

  function renderMaskedDateSection(chars, positions, minLength = 0) {
    let lastVisibleOffset = minLength - 1;
    positions.forEach((position, offset) => {
      if (chars[position] !== ' ') lastVisibleOffset = Math.max(lastVisibleOffset, offset);
    });
    return lastVisibleOffset < 0
      ? ''
      : positions.slice(0, lastVisibleOffset + 1).map(position => chars[position]).join('');
  }

  function normalizeMaskedDateValue(value) {
    const raw = String(value || '');
    const chars = Array(10).fill(' ');
    const dayPositions = DATE_MASK_DIGIT_POSITIONS.slice(0, 2);
    const monthPositions = DATE_MASK_DIGIT_POSITIONS.slice(2, 4);
    const yearPositions = DATE_MASK_DIGIT_POSITIONS.slice(4);

    if (!raw.includes('.')) {
      const digits = raw.replace(/\D/g, '').slice(0, DATE_MASK_DIGIT_POSITIONS.length);
      digits.split('').forEach((digit, index) => {
        chars[DATE_MASK_DIGIT_POSITIONS[index]] = digit;
      });
      const day = renderMaskedDateSection(chars, dayPositions);
      const month = renderMaskedDateSection(chars, monthPositions);
      const year = renderMaskedDateSection(chars, yearPositions);
      if (year) return `${day}.${month}.${year}`;
      if (month) return `${day}.${month}`;
      return day;
    }

    const parts = raw.split('.').slice(0, 3);
    const fillSection = (part, positions) => {
      String(part || '').slice(0, positions.length).split('').forEach((char, index) => {
        chars[positions[index]] = /\d/.test(char) ? char : ' ';
      });
    };
    fillSection(parts[0], dayPositions);
    fillSection(parts[1], monthPositions);
    fillSection(parts[2], yearPositions);

    const hasFirstSeparator = raw.includes('.');
    const hasSecondSeparator = (raw.match(/\./g) || []).length > 1;
    const getSectionMinLength = (part, positions, keepSeparator) => {
      if (!keepSeparator) return 0;
      const sectionText = String(part || '').slice(0, positions.length);
      return sectionText.replace(/\s/g, '') ? Math.min(sectionText.length, positions.length) : 0;
    };
    const day = renderMaskedDateSection(chars, dayPositions, getSectionMinLength(parts[0], dayPositions, hasFirstSeparator));
    const month = renderMaskedDateSection(chars, monthPositions, getSectionMinLength(parts[1], monthPositions, hasSecondSeparator));
    const year = renderMaskedDateSection(chars, yearPositions, getSectionMinLength(parts[2], yearPositions, true));

    if (year) return `${day}.${month}.${year}`;
    if (hasSecondSeparator && month) return `${day}.${month}.`;
    if (month) return `${day}.${month}`;
    if (hasFirstSeparator && day) return `${day}.`;
    return day;
  }

  function getMaskedDateChars(value) {
    const normalized = normalizeMaskedDateValue(value);
    const chars = Array(10).fill(' ');
    const parts = normalized.split('.').slice(0, 3);
    const sections = [
      DATE_MASK_DIGIT_POSITIONS.slice(0, 2),
      DATE_MASK_DIGIT_POSITIONS.slice(2, 4),
      DATE_MASK_DIGIT_POSITIONS.slice(4)
    ];
    parts.forEach((part, sectionIndex) => {
      String(part || '').slice(0, sections[sectionIndex].length).split('').forEach((char, index) => {
        chars[sections[sectionIndex][index]] = /\d/.test(char) ? char : ' ';
      });
    });
    if (parts.length > 1) chars[2] = '.';
    if (parts.length > 2) chars[5] = '.';
    return chars;
  }


  function getMaskedDateDigitIndex(cursorPosition, { backward = false } = {}) {
    if (backward) {
      for (let i = DATE_MASK_DIGIT_POSITIONS.length - 1; i >= 0; i--) {
        if (DATE_MASK_DIGIT_POSITIONS[i] < cursorPosition) return DATE_MASK_DIGIT_POSITIONS[i];
      }
      return -1;
    }

    return DATE_MASK_DIGIT_POSITIONS.find(position => position >= cursorPosition) ?? -1;
  }

  function getNextMaskedDateCursorPosition(digitPosition) {
    const index = DATE_MASK_DIGIT_POSITIONS.indexOf(digitPosition);
    if (index < 0) return digitPosition;
    return DATE_MASK_DIGIT_POSITIONS[index + 1] ?? 10;
  }

  function setMaskedDateSelection(inputEl, position) {
    requestAnimationFrame(() => inputEl.setSelectionRange(position, position));
  }

  function toMaskedDateDigits(value) {
    const normalized = normalizeMaskedDateValue(value).padEnd(10, ' ');
    if (!normalized.trim()) return '';
    return DATE_MASK_DIGIT_POSITIONS.map(position => normalized[position]).join('');
  }

  function toServerDate(value) {
    const maskedDigits = toMaskedDateDigits(value);
    if (/^\d{8}$/.test(maskedDigits)) {
      return `${maskedDigits.slice(0, 2)}.${maskedDigits.slice(2, 4)}.${maskedDigits.slice(4)}`;
    }

    const parsed = parseDateString(value);
    if (!parsed) return '';
    const day = String(parsed.day).padStart(2, '0');
    const month = String(parsed.month).padStart(2, '0');
    return `${day}.${month}.${parsed.year}`;
  }

  async function loginDocs() {
    dom.error.textContent = '';
    stopAuthLoading();

    const loginVal = dom.login.value.trim();
    const dateInput = dom.password;
    dateInput.value = formatDateInput(dateInput.value, { finalizeYear: true });
    const passwordForServer = toServerDate(dateInput.value);
    const snilsFormatted = formatSnilsInput(dom.snils.value);
    dom.snils.value = snilsFormatted;
    saveAuthInputs(loginVal, dateInput.value, snilsFormatted);

    logLoginButtonClickClient();

    if (!loginVal || !passwordForServer) {
      dom.error.textContent = 'Введите ФИО и дату рождения в формате ДД.ММ.ГГГГ.';
      return;
    }

    startAuthLoading('Аутентификация');

    const clientInfo = await getClientInfo();
    clientInfo.snilsVisible = dom.snilsWrap.style.display !== 'none';

    google.script.run
      .withSuccessHandler(response => {
        if (response && response.error) {
          dom.error.textContent = response.error;
          stopAuthLoading();
          return;
        }

        if (response && response.requiresSnils) {
          startSnilsStep(loginVal, passwordForServer);
          dom.error.textContent = response.snilsError === 'invalid'
            ? 'Неверный СНИЛС.'
            : 'Для входа введите СНИЛС.';
          return;
        }

        localStorage.setItem('isLoggedIn', '1');
        hideSnilsStep();
        loadEditConfig()
          .then(() => showDocsResult(response))
          .catch(() => {
            dom.error.textContent = 'Не удалось загрузить правила редактирования.';
            stopAuthLoading();
          });
      })
      .checkLogin(loginVal, passwordForServer, clientInfo, snilsFormatted);
  }

  async function verifySnilsDocs() {
    dom.error.textContent = '';

    if (!authState.login || !authState.password) {
      const loginVal = dom.login.value.trim();
      const passwordForServer = toServerDate(formatDateInput(dom.password.value, { finalizeYear: true }));
      logLoginButtonClickClient();

      if (!loginVal || !passwordForServer) {
        dom.error.textContent = 'Введите ФИО и дату рождения в формате ДД.ММ.ГГГГ.';
        return;
      }
      authState.login = loginVal;
      authState.password = passwordForServer;
    }

    const snilsFormatted = formatSnilsInput(dom.snils.value);
    dom.snils.value = snilsFormatted;

    if (snilsFormatted.length !== 14) {
      dom.error.textContent = snilsFormatted ? 'Неверный СНИЛС.' : 'Для входа введите СНИЛС.';
      return;
    }

    startAuthLoading('Проверка СНИЛС');
    const clientInfo = await getClientInfo();
    clientInfo.snilsVisible = true;

    google.script.run
      .withSuccessHandler(response => {
        if (response && response.error) {
          dom.error.textContent = response.error;
          stopAuthLoading();
          return;
        }

        localStorage.setItem('savedLogin', authState.login);
        localStorage.setItem('savedDate', dom.password.value);
        localStorage.setItem('savedSnils', snilsFormatted);
        localStorage.setItem('isLoggedIn', '1');
        authState.awaitingSnils = false;
        authState.login = '';
        authState.password = '';
        dom.snilsWrap.style.display = 'block';
        loadEditConfig()
          .then(() => showDocsResult(response))
          .catch(() => {
            dom.error.textContent = 'Не удалось загрузить правила редактирования.';
            stopAuthLoading();
          });
      })
      .verifySnils(authState.login, authState.password, snilsFormatted, clientInfo);
  }

  async function getClientInfo() {
    const ip = await fetch('https://api.ipify.org?format=json')
      .then(r => r.json())
      .then(j => j.ip)
      .catch(() => 'не определён');

    const ua = navigator.userAgent.toLowerCase();
    let device = 'ПК';
    if (ua.includes('mobile')) device = 'Мобильный';
    if (ua.includes('tablet') || ua.includes('ipad')) device = 'Планшет';

    let browser = 'Неизвестный';
    if (ua.includes('chrome')) browser = 'Chrome';
    if (ua.includes('safari') && !ua.includes('chrome')) browser = 'Safari';
    if (ua.includes('firefox')) browser = 'Firefox';
    if (ua.includes('yabrowser')) browser = 'Yandex';
    if (ua.includes('edge')) browser = 'Edge';

    return { ip, device, browser };
  }

  const PARENT_SECTION_SUFFIXES = Object.freeze(['П', 'М', 'Д']);
  const PARENT_SECTION_FIELDS = Object.freeze([
    'Фамилия Имя Отчество',
    'Телефон +7',
    'Электронная почта',
    'Дата рождения',
    'Паспорт: Серия, номер',
    'Паспорт: Кем выдан',
    'Паспорт: Когда выдан',
    'Паспорт: Прописка',
    'Паспорт: Код подразделения',
    'Марка автомобиля',
    'гос. номер автомобиля'
  ]);

  function hasParentSectionData(header, row, suffix) {
    return PARENT_SECTION_FIELDS.some(field => {
      const index = header.indexOf(`${field} (${suffix})`);
      return index >= 0 && String(row[index] ?? '').trim() !== '';
    });
  }

  function showDocsResult(response) {
    if (response.error) {
      dom.error.textContent = response.error;
      stopAuthLoading();
      return;
    }

    const header = response.header;
    const row = response.row;
    const colors = response.colors || [];
    currentDocsRow = { header: [...header], row: [...row], colors: [...colors] };

    let html = '';

    const SECTION_STARTS = {
      'Фамилия Имя Отчество (С)': 'Спортсмен',
      'Фамилия Имя Отчество (П)': 'Отец',
      'Фамилия Имя Отчество (М)': 'Мать',
      'Фамилия Имя Отчество (Д)': 'Другой законный представитель'
    };

    const sectionKeys = Object.keys(SECTION_STARTS);
    const sectionPositions = [];

    for (let i = 0; i < header.length; i++) {
      if (sectionKeys.includes(header[i])) sectionPositions.push(i);
    }
    sectionPositions.push(header.length);

    for (let s = 0; s < sectionPositions.length - 1; s++) {
      const startIndex = sectionPositions[s];
      const endIndex = sectionPositions[s + 1];
      const sectionTitle = SECTION_STARTS[header[startIndex]];
      const suffixMatch = header[startIndex].match(/\(([ПМД])\)$/);
      const parentSuffix = suffixMatch ? suffixMatch[1] : '';
      const isParentSection = PARENT_SECTION_SUFFIXES.includes(parentSuffix);
      const hasValue = isParentSection
        ? hasParentSectionData(header, row, parentSuffix)
        : row.slice(startIndex, endIndex).some(value => String(value ?? '').trim() !== '');
      if (!hasValue && !isParentSection) continue;

      const contentId = isParentSection ? `parent-section-${parentSuffix}` : '';
      const isExpanded = !isParentSection || hasValue;
      if (isParentSection) {
        html += `<div class="parent-section" data-parent-section="${parentSuffix}"><button type="button" class="parent-section-header" aria-expanded="${isExpanded ? 'true' : 'false'}" aria-controls="${contentId}"><span class="parent-section-title">${escapeHtml(sectionTitle)}</span><span class="parent-section-toggle" aria-hidden="true">${isExpanded ? '−' : '＋'}</span></button><div id="${contentId}" class="parent-section-content" ${isExpanded ? '' : 'hidden'}>`;
      } else {
        html += `<div style="margin-top:1rem;margin-bottom:0.5rem;font-weight:bold;font-size:1.2rem;text-align:center;border-bottom:0.1rem solid #000;padding-bottom:0.35rem;">${sectionTitle}</div>`;
      }

      for (let i = startIndex; i < endIndex; i++) {
        const cleanedTitle = header[i].replace(/\(С\)|\(П\)|\(М\)|\(Д\)/g, '').trim();
        const bg = colors[i] || '';
        const style = bg ? `background:${bg};` : '';
        const rule = getFieldEditRule(header[i]);
        const attachment = getFieldAttachment(header[i]);
        const content = attachment
          ? renderAttachmentCellMarkup(i, row[i] ?? '', attachment)
          : renderCellDisplayMarkup(i, row[i] ?? '', rule.editable, rule.editable ? '' : 'non-editable', rule);
        html += `<div class="item"><div class="item-title">${escapeHtml(cleanedTitle)}</div><div class="item-value" style="${style}" data-col-index="${i}">${content}</div></div>`;
      }

      if (isParentSection) html += '</div></div>';
    }

    document.getElementById('result').innerHTML = html;
    stopAuthLoading();
  }

  document.addEventListener('click', function(e) {
    const headerBtn = e.target.closest('.parent-section-header');
    if (!headerBtn) return;

    const contentId = headerBtn.getAttribute('aria-controls');
    const content = contentId ? document.getElementById(contentId) : null;
    if (!content) return;

    const isExpanded = headerBtn.getAttribute('aria-expanded') === 'true';
    const nextExpanded = !isExpanded;
    headerBtn.setAttribute('aria-expanded', nextExpanded ? 'true' : 'false');
    content.hidden = !nextExpanded;

    const toggle = headerBtn.querySelector('.parent-section-toggle');
    if (toggle) toggle.textContent = nextExpanded ? '−' : '＋';
  });

  let attachmentState = { colIndex: -1, attachmentId: '', config: null, file: null, confirmReplace: false };

  function getFieldAttachment(headerTitle) {
    const field = editConfig?.fields?.[headerTitle];
    const attachment = field?.attachment ? editConfig?.attachments?.[field.attachment] : null;
    return attachment && attachment.enabled === true ? { ...attachment, id: field.attachment } : null;
  }

  function safeAttachmentUrl(value) {
    const url = String(value || '').trim();
    return /^https:\/\//i.test(url) ? url : '';
  }

  function renderAttachmentCellMarkup(colIndex, value, attachment) {
    const safeValue = safeAttachmentUrl(value);
    const link = safeValue ? `<a class="attachment-link" href="${escapeHtmlAttr(safeValue)}" target="_blank" rel="noopener">Открыть файл</a>` : '<span class="cell-value-text">Файл не прикреплён</span>';
    return `<div class="cell-edit-shell">${link}<button type="button" class="attachment-btn" data-col-index="${colIndex}" data-attachment-id="${escapeHtmlAttr(attachment.id)}">Прикрепить</button></div>`;
  }

  function bytesToLabel(bytes) { return `${(bytes / 1024 / 1024).toFixed(bytes >= 1024 * 1024 ? 1 : 2)} МБ`; }

  function openAttachmentModal(colIndex, attachmentId) {
    const config = getFieldAttachment(currentDocsRow.header[colIndex]);
    if (!config || config.id !== attachmentId) return;
    attachmentState = { colIndex, attachmentId, config, file: null, confirmReplace: false };
    dom.attachmentModalTitle.textContent = `Прикрепить: ${config.title}`;
    const current = safeAttachmentUrl(currentDocsRow.row[colIndex]);
    dom.attachmentCurrent.hidden = !current;
    dom.attachmentCurrent.innerHTML = current ? `Текущий файл: <a href="${escapeHtmlAttr(current)}" target="_blank" rel="noopener">открыть</a>. При загрузке нового файла потребуется подтверждение.` : '';
    dom.attachmentFileInput.value = '';
    dom.attachmentFileInfo.textContent = '';
    dom.attachmentError.textContent = '';
    dom.attachmentUpload.disabled = true;
    dom.attachmentModal.hidden = false;
    dom.attachmentModal.setAttribute('aria-hidden', 'false');
  }

  function closeAttachmentModal() {
    dom.attachmentModal.hidden = true;
    dom.attachmentModal.setAttribute('aria-hidden', 'true');
    attachmentState.file = null;
  }

  function selectAttachmentFile(file) {
    const config = attachmentState.config;
    attachmentState.file = null;
    if (!file || !config) return;
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const maxBytes = Number(config.maxSizeMb) * 1024 * 1024;
    if (!config.allowedExtensions.includes(ext)) {
      dom.attachmentError.textContent = `Разрешены файлы: ${config.allowedExtensions.join(', ')}.`;
      dom.attachmentUpload.disabled = true;
      return;
    }
    if (!file.size || file.size > maxBytes) {
      dom.attachmentError.textContent = `Размер файла не должен превышать ${config.maxSizeMb} МБ.`;
      dom.attachmentUpload.disabled = true;
      return;
    }
    attachmentState.file = file;
    dom.attachmentError.textContent = '';
    dom.attachmentFileInfo.textContent = `${file.name} — ${bytesToLabel(file.size)}`;
    dom.attachmentUpload.disabled = false;
  }

  function uploadSelectedAttachment() {
    const { file, attachmentId, colIndex } = attachmentState;
    if (!file || !attachmentId) return;
    const reader = new FileReader();
    dom.attachmentUpload.disabled = true;
    reader.onerror = () => { dom.attachmentError.textContent = 'Не удалось прочитать выбранный файл.'; dom.attachmentUpload.disabled = false; };
    reader.onload = () => {
      const base64 = String(reader.result || '').split(',')[1] || '';
      google.script.run
        .withSuccessHandler(response => {
          if (response?.requiresConfirmation) {
            const title = response.currentFileName || 'текущий файл';
            if (!confirm(`Документ уже прикреплён (${title}). Заменить его новым файлом?`)) { closeAttachmentModal(); return; }
            attachmentState.confirmReplace = true;
            sendAttachmentUpload(base64);
            return;
          }
          currentDocsRow.row[colIndex] = response.url;
          const cell = document.querySelector(`.item-value[data-col-index="${colIndex}"]`);
          const config = getFieldAttachment(currentDocsRow.header[colIndex]);
          if (cell && config) cell.innerHTML = renderAttachmentCellMarkup(colIndex, response.url, config);
          closeAttachmentModal();
          showToast('Документ успешно прикреплён.');
        })
        .withFailureHandler(error => { dom.attachmentError.textContent = error?.message || 'Не удалось загрузить документ.'; dom.attachmentUpload.disabled = false; })
        .uploadAttachment(dom.login.value.trim(), dom.password.value.trim(), dom.snils.value.trim(), attachmentId, { name: file.name, mimeType: file.type, base64, confirmReplace: false });
    };
    reader.readAsDataURL(file);
  }

  function sendAttachmentUpload(base64) {
    const { file, attachmentId, colIndex } = attachmentState;
    google.script.run
      .withSuccessHandler(response => {
        currentDocsRow.row[colIndex] = response.url;
        const cell = document.querySelector(`.item-value[data-col-index="${colIndex}"]`);
        const config = getFieldAttachment(currentDocsRow.header[colIndex]);
        if (cell && config) cell.innerHTML = renderAttachmentCellMarkup(colIndex, response.url, config);
        closeAttachmentModal(); showToast('Документ успешно заменён.');
      })
      .withFailureHandler(error => { dom.attachmentError.textContent = error?.message || 'Не удалось заменить документ.'; dom.attachmentUpload.disabled = false; })
      .uploadAttachment(dom.login.value.trim(), dom.password.value.trim(), dom.snils.value.trim(), attachmentId, { name: file.name, mimeType: file.type, base64, confirmReplace: true });
  }

  document.addEventListener('click', event => {
    const button = event.target.closest('.attachment-btn');
    if (button) openAttachmentModal(Number(button.dataset.colIndex), button.dataset.attachmentId);
  });
  dom.attachmentCancel.addEventListener('click', closeAttachmentModal);
  dom.attachmentDropzone.addEventListener('click', () => dom.attachmentFileInput.click());
  dom.attachmentDropzone.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); dom.attachmentFileInput.click(); } });
  dom.attachmentFileInput.addEventListener('change', () => selectAttachmentFile(dom.attachmentFileInput.files[0]));
  ['dragenter', 'dragover'].forEach(type => dom.attachmentDropzone.addEventListener(type, event => { event.preventDefault(); dom.attachmentDropzone.classList.add('is-dragover'); }));
  ['dragleave', 'drop'].forEach(type => dom.attachmentDropzone.addEventListener(type, event => { event.preventDefault(); dom.attachmentDropzone.classList.remove('is-dragover'); }));
  dom.attachmentDropzone.addEventListener('drop', event => selectAttachmentFile(event.dataTransfer.files[0]));
  dom.attachmentUpload.addEventListener('click', uploadSelectedAttachment);

  function iconSvg(name) {
    const icons = {
      edit: '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>',
      save: '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>',
      cancel: '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
      help: '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.1 9a3 3 0 1 1 5.8 1c-.7 1.2-2.4 1.7-2.4 3"/><path d="M12 17h.01"/><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>'
    };
    return icons[name] || '';
  }

  function renderCellEditButton(colIndex, editable = true, extraClass = '') {
    return `<button type="button" class="attendance-icon-btn cell-edit-btn ${extraClass}" data-col-index="${colIndex}" data-mode="edit" title="Редактировать" aria-label="Редактировать" ${editable ? '' : 'disabled'}>${iconSvg('edit')}</button>`;
  }

  function getFieldDescription(rule) {
    const parts = [];
    if (rule.description) parts.push(rule.description);
    if (rule.example) parts.push(`Пример: ${rule.example}`);
    if (rule.required) parts.push('Обязательное поле.');
    return parts.join(' ');
  }

  function renderCellHelpButton(colIndex, rule) {
    const description = getFieldDescription(rule) || 'Нет дополнительного описания.';
    return `<div class="cell-edit-help"><button type="button" class="attendance-icon-btn cell-edit-btn" data-col-index="${colIndex}" data-mode="help" title="Описание" aria-label="Описание поля" aria-expanded="false">${iconSvg('help')}</button><div class="cell-help-popover" role="note">${escapeHtml(description)}</div></div>`;
  }

  function renderCellViewActions(colIndex, editable = true, extraClass = '', rule = {}) {
    return `<div class="cell-edit-actions">${renderCellHelpButton(colIndex, rule)}${renderCellEditButton(colIndex, editable, extraClass)}</div>`;
  }

  function renderCellEditActions(colIndex) {
    return `<div class="cell-edit-actions"><button type="button" class="attendance-icon-btn cell-edit-btn" data-col-index="${colIndex}" data-mode="save" title="Сохранить" aria-label="Сохранить" disabled>${iconSvg('save')}</button><button type="button" class="attendance-icon-btn cell-edit-btn" data-col-index="${colIndex}" data-mode="cancel" title="Отмена" aria-label="Отмена">${iconSvg('cancel')}</button></div>`;
  }

  function renderCellDisplayMarkup(colIndex, value, editable = true, extraClass = '', rule = {}) {
    return `<div class="cell-edit-shell"><div class="cell-editor"><div class="cell-value-display"><div class="cell-value-text">${escapeHtml(value)}</div></div></div>${renderCellViewActions(colIndex, editable, extraClass, rule)}</div>`;
  }

  function renderCellDisplay(cell, colIndex, value) {
    const bg = currentDocsRow.colors[colIndex] || '';
    const style = bg ? `background:${bg};` : '';
    const rule = getFieldEditRule(currentDocsRow.header[colIndex]);
    const btnClass = rule.editable ? '' : 'non-editable';
    cell.innerHTML = renderCellDisplayMarkup(colIndex, value, rule.editable, btnClass, rule);
    cell.setAttribute('style', style);
  }


  document.addEventListener('click', function(e) {
    const btn = e.target.closest('.cell-edit-btn');
    if (!btn) return;
    const colIndex = Number(btn.dataset.colIndex);
    const rule = getFieldEditRule(currentDocsRow.header[colIndex]);
    if (Number.isNaN(colIndex)) return;
    const cell = btn.closest('.item-value');
    const mode = btn.dataset.mode || 'edit';
    if (mode === 'help') {
      const help = btn.closest('.cell-edit-help');
      if (!help) return;
      e.stopPropagation();
      const nextPinned = !help.classList.contains('is-pinned');
      document.querySelectorAll('.cell-edit-help.is-pinned').forEach(node => {
        if (node !== help) {
          node.classList.remove('is-pinned');
          const pinnedBtn = node.querySelector('.cell-edit-btn[data-mode="help"]');
          if (pinnedBtn) pinnedBtn.setAttribute('aria-expanded', 'false');
        }
      });
      help.classList.toggle('is-pinned', nextPinned);
      btn.setAttribute('aria-expanded', nextPinned ? 'true' : 'false');
      return;
    }
    if (!rule.editable) return;
    if (mode === 'edit') {
      const textNode = cell.querySelector('.cell-value-text');
      const value = textNode ? textNode.textContent : '';
      cell.dataset.originalValue = value;
      cell.innerHTML = `<div class="cell-edit-shell"><div class="cell-editor"><input class="cell-value-input" data-col-index="${colIndex}" value="${escapeHtmlAttr(value)}" /></div>${renderCellEditActions(colIndex)}</div>`;
      const input = cell.querySelector('input');
      const suggestConfig = rule.special === 'suggest' ? rule.suggestions : null;
      let suggestionOptions = [];
      let activeSuggestionIndex = -1;
      const dropSuggestionList = () => {
        const existing = cell.querySelector('.cell-suggest-list');
        if (existing) existing.remove();
        activeSuggestionIndex = -1;
      };
      const renderSuggestionList = () => {
        dropSuggestionList();
        const list = filterSuggestions(input.value, suggestionOptions);
        if (!list.length) return;
        const wrap = document.createElement('div');
        wrap.className = 'cell-suggest-list';
        list.forEach((item, idx) => {
          const opt = document.createElement('div');
          opt.className = 'cell-suggest-item';
          opt.dataset.index = String(idx);
          opt.textContent = item;
          opt.addEventListener('mousedown', event => {
            event.preventDefault();
            input.value = item;
            validate();
            dropSuggestionList();
            input.focus();
          });
          wrap.appendChild(opt);
        });
        const editor = cell.querySelector('.cell-editor');
        if (editor) editor.appendChild(wrap);
      };
      if (rule.placeholder) input.placeholder = rule.placeholder;
      if (rule.special === 'date') input.placeholder = 'ДД.ММ.ГГГГ';
      if (rule.special === 'date') input.addEventListener('blur', function() {
        const formatted = formatDateInput(input.value, { finalizeYear: true });
        if (formatted !== input.value) input.value = formatted;
        validate();
      });
      input.focus();
      input.select();
      const validate = () => {
        const saveBtn = cell.querySelector('.cell-edit-btn[data-mode="save"]');
        if (!saveBtn) return;
        const trimmed = input.value.trim();
        const ok = isValidFieldValue(trimmed, rule);
        saveBtn.disabled = !ok;
        saveBtn.classList.toggle('save-ready', ok);
      };
      input.addEventListener('input', () => {
        const prepared = applyInputSpecial(input.value, rule);
        if (prepared !== input.value) input.value = prepared;
        validate();
        renderSuggestionList();
      });
      input.addEventListener('keydown', event => {
        const items = [...cell.querySelectorAll('.cell-suggest-item')];
        if ((event.key === 'ArrowDown' || event.key === 'ArrowUp') && items.length) {
          event.preventDefault();
          activeSuggestionIndex = event.key === 'ArrowDown'
            ? Math.min(activeSuggestionIndex + 1, items.length - 1)
            : Math.max(activeSuggestionIndex - 1, 0);
          items.forEach((node, idx) => node.classList.toggle('active', idx === activeSuggestionIndex));
          return;
        }
        if (event.key === 'Escape') {
          event.preventDefault();
          dropSuggestionList();
          const cancelBtn = cell.querySelector('.cell-edit-btn[data-mode="cancel"]');
          if (cancelBtn) cancelBtn.click();
          return;
        }
        if (event.key !== 'Enter') return;
        event.preventDefault();
        if (items.length) {
          const selectedIndex = activeSuggestionIndex >= 0 ? activeSuggestionIndex : 0;
          input.value = items[selectedIndex].textContent || '';
          validate();
          dropSuggestionList();
        }
        input.blur();
        setTimeout(() => {
          const saveBtn = cell.querySelector('.cell-edit-btn[data-mode="save"]');
          validate();
          if (!saveBtn || saveBtn.disabled) return;
          saveBtn.click();
        }, 0);
      });
      input.addEventListener('blur', () => setTimeout(dropSuggestionList, 120));
      validate();
      if (suggestConfig) {
        google.script.run
          .withSuccessHandler(options => {
            suggestionOptions = Array.isArray(options) ? options : [];
            renderSuggestionList();
          })
          .withFailureHandler(() => {})
          .getFieldSuggestions(currentDocsRow.header[colIndex]);
      }
      return;
    }
    if (mode === 'cancel') {
      const originalValue = cell.dataset.originalValue ?? '';
      const existing = cell.querySelector('.cell-suggest-list');
      if (existing) existing.remove();
      delete cell.dataset.originalValue;
      renderCellDisplay(cell, colIndex, originalValue);
      return;
    }
    const input = cell.querySelector('input');

    const end = input.selectionEnd || start;

      e.preventDefault();
      const chars = getMaskedDateChars(value || e.key);
      DATE_MASK_DIGIT_POSITIONS.forEach(pos => {

      chars[position] = e.key;
      if (position >= 3) chars[2] = '.';
      if (position >= 6) chars[5] = '.';
      input.value = normalizeMaskedDateValue(chars.join(''));
      setMaskedDateSelection(input, getNextMaskedDateCursorPosition(position));

      return;
    }

    const position = e.key === 'Backspace'
      ? getMaskedDateDigitIndex(start, { backward: start === end })

    e.preventDefault();

  function hydrateExistingRows() {
    if (restoreAttendanceDraft()) {
      const lastRestored = tbody.lastElementChild;
      if (lastRestored && lastRestored.cells[0].innerText.trim()) {
        tbody.appendChild(createRow());
      }
      scheduleMatch();
      return;
    }
    const rows = [...tbody.rows];
    rows.forEach(row => {

  function caretPos(el) {
    const selection = window.getSelection();
    if (!selection || selection.rangeCount === 0) return 0;

    const range = selection.getRangeAt(0).cloneRange();
    range.selectNodeContents(el);
    range.setEnd(selection.focusNode, selection.focusOffset);
    return range.toString().length;
  }

  function setCaret(el, pos) {
    const r = document.createRange();
    const s = window.getSelection();
    r.selectNodeContents(el);
    r.collapse(true);

    const textNode = el.firstChild;
    const maxPos = (textNode ? textNode.textContent : el.textContent || '').length;
    const safePos = Math.min(Math.max(pos, 0), maxPos);

    r.setStart(textNode || el, safePos);
    s.removeAllRanges();
    s.addRange(r);
    el.focus();
  }

  function extractLinesFromCell(cell) {
    const html = cell.innerHTML
      .replace(/<div>/gi, '\n')
      .replace(/<\/div>/gi, '')
      .replace(/<br\s*\/?>/gi, '\n');

      .split(/\n+/)

  tbody.addEventListener('keydown', e => {
    if (!e.target.classList.contains('input')) return;

    const cell = e.target;
    const row = cell.parentElement;
    const pos = caretPos(cell);
    const text = cell.innerText;

    if (e.key === 'Enter') {
      e.preventDefault();
      cell.innerText = text.slice(0, pos);
      const r = createRow(text.slice(pos));
      row.after(r);
      setCaret(r.cells[0], 0);
      saveAttendanceDraft();
      scheduleMatch();
    }

    if (e.key === 'Backspace' && pos === 0) {
      const prev = row.previousElementSibling;
      if (!prev) return;
      e.preventDefault();
      const p = prev.cells[0];
      const len = p.innerText.length;
      p.innerText += text;
      removeRowAndState(row);
      setCaret(p, len);
      saveAttendanceDraft();
      scheduleMatch();
    }

    if (e.key === 'Delete' && pos === text.length) {
      const next = row.nextElementSibling;
      if (!next) return;
      e.preventDefault();
      const n = next.cells[0];
      const len = text.length;
      cell.innerText += n.innerText;
      removeRowAndState(next);
      setCaret(cell, len);
      saveAttendanceDraft();
      scheduleMatch();
    }

    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault();
      const targetRow = e.key === 'ArrowUp' ? row.previousElementSibling : row.nextElementSibling;
      if (!targetRow) return;
      const targetCell = targetRow.cells[0];
      const targetPos = Math.min(pos, targetCell.innerText.length);
      setCaret(targetCell, targetPos);
    }
  });

      if (last && last.cells[0].innerText.trim()) tbody.appendChild(createRow());
      saveAttendanceDraft();
      scheduleMatch();
      return;
    }

    cell.innerText = lines[0];
    let currentRow = row;
    for (let i = 1; i < lines.length; i++) {
      const r = createRow(lines[i]);
      currentRow.after(r);
      currentRow = r;
    }

    setCaret(currentRow.cells[0], currentRow.cells[0].innerText.length);
    saveAttendanceDraft();
    scheduleMatch();
  });

  function getDistinctFilterValues(key) {
