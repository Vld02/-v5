<script>
  <?!= getClientConfigScript(); ?>

  (function applyResponsiveConfig() {
    const root = document.documentElement;
    const responsive = CLIENT_CONFIG.responsive;
    const hoverMedia = window.matchMedia && window.matchMedia('(hover: hover)');

    root.style.setProperty('--page-max-width', `${responsive.pageMaxWidth}px`);
    root.classList.toggle('supports-hover', Boolean(hoverMedia && hoverMedia.matches));

    const updateInterfaceScale = () => {
      // clientWidth — ширина CSS viewport. Она не зависит от виртуальной
      // ширины мобильного браузера при корректном viewport-метатеге.
      const viewportWidth = root.clientWidth || window.innerWidth;
      const compactRange = responsive.compactModeWidth - responsive.compactMinViewportWidth;
      const compactProgress = Math.max(0, Math.min(1,
        (responsive.compactModeWidth - viewportWidth) / compactRange
      ));
      // compactModeWidth — начало масштабирования, compactMinViewportWidth — его нижняя граница.
      const scale = 1 - (1 - responsive.minimumInterfaceScale) * compactProgress;
      root.style.setProperty('--base-font-size', `${scale}rem`);
    };

    updateInterfaceScale();
    window.addEventListener('resize', updateInterfaceScale, { passive: true });
    if (hoverMedia && hoverMedia.addEventListener) {
      hoverMedia.addEventListener('change', event => root.classList.toggle('supports-hover', event.matches));
    }
  })();
</script>

  @keyframes toast-spin { to { transform:rotate(360deg); } }

<script>
  /*************************************************
   * ОБЩИЕ DOM-ССЫЛКИ И НАВИГАЦИЯ ПО ВКЛАДКАМ
   *************************************************/
  const dom = {
    error: document.getElementById('error'),
    loading: document.getElementById('loading'),
    login: document.getElementById('login'),
    password: document.getElementById('password'),
    snils: document.getElementById('snils'),
    snilsWrap: document.getElementById('snilsWrap'),
    toastContainer: document.getElementById('toastContainer')
  };

  const topbarTabs = [...document.querySelectorAll('.topbar-tab')];

  const tabPanels = {
    docs: document.getElementById('tab-docs'),
    attendance: document.getElementById('tab-attendance'),
    gear: document.getElementById('tab-gear')
  };
  const AUTH_STORAGE_KEYS = CLIENT_CONFIG.storageKeys;
  // Новый идентификатор при каждой загрузке страницы; не сохраняем его в storage.
  const LOG_SESSION_ID = window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  const UI_TIMINGS = CLIENT_CONFIG.timings;
  const NO_GROUP_LABEL = <?!= JSON.stringify(TRAINING_CONFIG.noGroupLabel) ?>;
  const ACTIVE_TAB_STORAGE_KEY = AUTH_STORAGE_KEYS.activeTab;
  const ATTENDANCE_ROWS_STORAGE_KEY = CLIENT_CONFIG.storageKeys.attendanceRows;
  const ATTENDANCE_DRAFT_DELETE_AFTER_KEY = CLIENT_CONFIG.storageKeys.attendanceDraftDeleteAfter;
  const ATTENDANCE_DRAFT_TTL_MS = CLIENT_CONFIG.timings.attendanceDraftTtlMs;
  const LAST_SILENT_SYNC_KEY = CLIENT_CONFIG.storageKeys.lastSilentSync;
  const SILENT_SYNC_INTERVAL_MS = CLIENT_CONFIG.timings.silentSyncIntervalMs;
  const TRAINING_HISTORY_STORAGE_KEY = CLIENT_CONFIG.storageKeys.trainingHistory;
  const DOCUMENT_EDIT_DRAFTS_STORAGE_KEY = CLIENT_CONFIG.storageKeys.documentEditDrafts;
  const DOCUMENT_DRAFT_SAVE_DEBOUNCE_MS = CLIENT_CONFIG.timings.documentDraftSaveDebounceMs;
  const TRAINING_SHEET_URL = CLIENT_CONFIG.urls.trainingSheet;

  /* ============================================================
   КОНФИГУРАЦИЯ РЕДАКТИРОВАНИЯ НА КЛИЕНТЕ

   Единственный источник истины находится на сервере в Code.gs:
   EDIT_CONFIG.rules и EDIT_CONFIG.fields. Браузер хранит только
   полученную копию в editConfig, чтобы построить интерфейс, подсказки,
   плейсхолдеры и клиентскую проверку для удобства пользователя.

   ВАЖНО: эту копию можно изменить через DevTools, поэтому она не
   является защитой. updateResultCell() всегда заново проверяет
   поле и значение по серверному EDIT_CONFIG.
   ============================================================ */
  let editConfig = null;
  let editConfigPromise = null;

  function loadEditConfig() {
    if (editConfig) return Promise.resolve(editConfig);
    if (editConfigPromise) return editConfigPromise;

    editConfigPromise = new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(config => {
          // Не фиксируем пустой/неполный ответ как загруженную конфигурацию:
          // иначе FILE-поля навсегда превратятся в неактивные TEXT-поля.
          if (!config || !config.rules || !config.fields || !config.rules.FILE) {
            editConfigPromise = null;
            reject(new Error('Сервер вернул неполную конфигурацию редактирования.'));
            return;
          }
          editConfig = config;
          resolve(editConfig);
        })
        .withFailureHandler(error => {
          editConfigPromise = null;
          reject(error);
        })
        .getEditConfig();
    });

    return editConfigPromise;
  }

  let currentDocsRow = { header: [], serverRow: [], sourceRowIndex: null, colors: [], fileStates: [], attachmentUploads: {}, draftValues: {}, draftKey: '' };
  let documentDraftSaveTimer = null;

  loadEditConfig().catch(() => {});

  function getFieldEditRule(headerTitle) {
    // showDocsResult() ожидает loadEditConfig(), поэтому отсутствие конфигурации
    // здесь — ошибка порядка выполнения, а не повод подменять FILE на TEXT.
    if (!editConfig) throw new Error('Конфигурация редактирования ещё не загружена.');

    const fieldConfig = editConfig.fields[headerTitle] || { editable: false, rule: 'TEXT', required: false, isIdentityField: false };
    const editRule = editConfig.rules[fieldConfig.rule] || editConfig.rules.TEXT || { regex: '^.*$', special: '', placeholder: '' };
    return { ...editRule, ...fieldConfig, ruleKey: fieldConfig.rule };
  }

  function getDocumentDraftKey() {
    return [dom.login.value.trim(), dom.password.value.trim(), dom.snils.value.trim()].join('\u001f');
  }

  function readDocumentDrafts() {
    try {
      const drafts = JSON.parse(localStorage.getItem(DOCUMENT_EDIT_DRAFTS_STORAGE_KEY) || '{}');
      return drafts && typeof drafts === 'object' ? drafts : {};
    } catch (_) {
      return {};
    }
  }

  function writeDocumentDraft(draftKey, draftValues) {
    if (!draftKey) return;
    const drafts = readDocumentDrafts();
    if (Object.keys(draftValues).length) {
      drafts[draftKey] = { values: draftValues };
    } else {
      delete drafts[draftKey];
    }
    try {
      localStorage.setItem(DOCUMENT_EDIT_DRAFTS_STORAGE_KEY, JSON.stringify(drafts));
    } catch (_) {}
  }

  function writeCurrentDocumentDraft() {
    writeDocumentDraft(currentDocsRow.draftKey, currentDocsRow.draftValues);
  }

  function scheduleDocumentDraftSave() {
    if (documentDraftSaveTimer) clearTimeout(documentDraftSaveTimer);
    const draftKey = currentDocsRow.draftKey;
    const draftValues = { ...currentDocsRow.draftValues };
    documentDraftSaveTimer = setTimeout(() => {
      documentDraftSaveTimer = null;
      writeDocumentDraft(draftKey, draftValues);
    }, DOCUMENT_DRAFT_SAVE_DEBOUNCE_MS);
  }

  function setDocumentDraftValue(colIndex, value) {
    const columnName = currentDocsRow.header[colIndex];
    if (!columnName) return;

    const normalizedValue = String(value ?? '');
    const serverValue = String(currentDocsRow.serverRow[colIndex] ?? '');
    if (normalizedValue === serverValue) {
      delete currentDocsRow.draftValues[columnName];
    } else {
      currentDocsRow.draftValues[columnName] = normalizedValue;
    }
    scheduleDocumentDraftSave();
  }

  function removeDocumentDraftValue(colIndex) {
    const columnName = currentDocsRow.header[colIndex];
    if (!columnName) return;
    delete currentDocsRow.draftValues[columnName];
    if (documentDraftSaveTimer) {
      clearTimeout(documentDraftSaveTimer);
      documentDraftSaveTimer = null;
    }
    writeCurrentDocumentDraft();
  }

  function moveCurrentDocumentDraftToCurrentIdentity(previousDraftKey) {
    const nextDraftKey = getDocumentDraftKey();
    if (!previousDraftKey || previousDraftKey === nextDraftKey) return;

    if (documentDraftSaveTimer) {
      clearTimeout(documentDraftSaveTimer);
      documentDraftSaveTimer = null;
    }
    writeDocumentDraft(previousDraftKey, {});
    currentDocsRow.draftKey = nextDraftKey;
    writeCurrentDocumentDraft();
  }

  window.addEventListener('pagehide', () => {
    if (documentDraftSaveTimer) {
      clearTimeout(documentDraftSaveTimer);
      documentDraftSaveTimer = null;
    }
    writeCurrentDocumentDraft();
  });

  function applyInputSpecial(rawValue, rule) {
    const value = String(rawValue || '');
    if (!rule || !rule.special) return value;
    if (rule.special === 'date') return formatDateInput(value);
    if (rule.special === 'year') return value.replace(/\D/g, '').slice(0, 4);
    if (rule.special === 'classCourse') return value.toUpperCase().replace(/[^0-9IV]/g, '').slice(0, rule.maxLength);
    if (rule.special === 'singleRuUpper') {
      const onlyRu = value.toUpperCase().replace(/[^А-ЯЁ]/g, '');
      return onlyRu.slice(0, 1);
    }
    if (rule.special === 'email') return value.replace(/[А-Яа-яЁё]/g, '');
    if (rule.special === 'snils') return formatSnilsInput(value);
    if (rule.special === 'passportRu') return formatPassportRuInput(value);
    if (rule.special === 'passportDivisionCode') return formatPassportDivisionCodeInput(value);
    if (rule.special === 'medPolicyNumber') return formatMedPolicyNumberInput(value);
    if (rule.special === 'mgfsoId') return value.replace(/\D/g, '').slice(0, 7);
    if (rule.special === 'phoneRu') {
      const raw = value.trim();
      const digits = raw.replace(/\D/g, '');
      let normalizedDigits = digits;
      if (raw.startsWith('+')) {
        normalizedDigits = digits.startsWith('7') ? digits.slice(1) : digits;
      } else if (raw.startsWith('8') || raw.startsWith('7')) {
        normalizedDigits = digits.slice(1);
      }
      normalizedDigits = normalizedDigits.slice(0, 11);
      const countryAndBody = (`7${normalizedDigits}`).slice(0, 12);
      const body = countryAndBody.slice(1);
      const p1 = body.slice(0, 3);
      const p2 = body.slice(3, 6);
      const p3 = body.slice(6, 8);
      const p4 = body.slice(8, 10);
      let formatted = '+7';
      if (p1) formatted += ` ${p1}`;
      if (p2) formatted += ` ${p2}`;
      if (p3) formatted += `-${p3}`;
      if (p4) formatted += `-${p4}`;
      return formatted;
    }
    if (rule.special === 'certificate') {
      let raw = value.toUpperCase().replace(/[^VIXА-ЯЁ0-9№#\\-\\s]/g, '');
      raw = raw.replace(/#/g, '№');
      const roman = (raw.match(/[VIX]/g) || []).join('').slice(0, 4);
      const letters = raw.replace(/[^А-ЯЁ]/g, '').slice(0, 3);
      const digits = raw.replace(/\D/g, '').slice(0, 6);
      let formatted = roman;
      if (roman && letters) formatted += `-${letters}`;
      if (roman && letters && digits) formatted += ` № ${digits}`;
      return formatted;
    }
    return value;
  }


  function formatPassportRuInput(value) {
    const digits = String(value || '').replace(/\D/g, '').slice(0, 10);
    const seriesA = digits.slice(0, 2);
    const seriesB = digits.slice(2, 4);
    const number = digits.slice(4, 10);
    let formatted = seriesA;
    if (seriesB) formatted += ` ${seriesB}`;
    if (number) formatted += ` ${number}`;
    return formatted;
  }

  function formatPassportDivisionCodeInput(value) {
    const digits = String(value || '').replace(/\D/g, '').slice(0, 6);
    const first = digits.slice(0, 3);
    const second = digits.slice(3, 6);
    return second ? `${first}-${second}` : first;
  }

  function formatMedPolicyNumberInput(value) {
    const digits = String(value || '').replace(/\D/g, '').slice(0, 16);
    return digits.match(/.{1,4}/g)?.join(' ') || '';
  }

  function getMaxEnrollmentYear() {
    return new Date().getFullYear() + CLIENT_CONFIG.validation.enrollmentYearOffset;
  }

  function isEnrollmentYearInRange(value) {
    const year = Number(value);
    return Number.isInteger(year) && year >= CLIENT_CONFIG.validation.enrollmentYearMin && year <= getMaxEnrollmentYear();
  }

  function isValidRuDate(value) {
    const match = String(value || '').match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
    if (!match) return false;

    const day = Number(match[1]);
    const month = Number(match[2]);
    const year = Number(match[3]);

    if (month < 1 || month > 12) return false;
    if (day < 1) return false;

    const daysInMonth = new Date(year, month, 0).getDate();
    return day <= daysInMonth;
  }

  function isValidFieldValue(trimmedValue, rule) {
    const value = String(trimmedValue || '');
    if (value === '') return !rule.required;
    if (!new RegExp(rule.regex).test(value)) return false;
    if (rule.special === 'year') return isEnrollmentYearInRange(value);
    if (rule.special === 'date') return isValidRuDate(value);
    return true;
  }

  function logUserMessage(message, type = 'warning') {
    const text = String(message || '').trim();
    if (!text) return;
    const prefix = type === 'error' ? 'Ошибка' : 'Предупреждение';
    const normalized = text.replace(/^(Ошибка|Предупреждение):\s*/i, '');
    logEventClient(type === 'error' ? 'user_error' : 'user_warning', { message: normalized });
  }

  function setErrorMessage(message, type = 'warning') {
    const text = String(message || '').trim();
    dom.error.textContent = text;
    if (text) logUserMessage(text, type);
  }

  function getAuthMessageType(message) {
    return /(?:СНИЛС|введите ФИО|дату рождения)/i.test(String(message || '')) ? 'warning' : 'error';
  }

  function showToast(message, type = 'success', autoHide = true) {
    const toast = document.createElement('div');
    toast.className = `toast ${type === 'error' ? 'error' : type === 'loading' ? 'loading' : 'success'}`;
    toast.textContent = message;
    dom.toastContainer.appendChild(toast);
    if (type === 'error') logUserMessage(message, 'error');
    if (autoHide) setTimeout(() => toast.remove(), CLIENT_CONFIG.timings.toastAutoHideMs);
    return toast;
  }

  function closeToast(toast) {
    if (toast && toast.isConnected) toast.remove();
  }

  function updateCurrentIdentityAfterSave(columnName, value) {
    if (columnName === CLIENT_CONFIG.authFields.login) {
      dom.login.value = value;
    } else if (columnName === CLIENT_CONFIG.authFields.password) {
      dom.password.value = value;
    } else if (columnName === CLIENT_CONFIG.authFields.snils) {
      dom.snils.value = formatSnilsInput(value);
    }
    saveAuthInputs(dom.login.value.trim(), dom.password.value.trim(), dom.snils.value.trim());
  }

  function filterSuggestions(query, options) {
    const normalizedQuery = String(query || '').trim().toLowerCase().replace(/ё/g, 'е');
    const uniq = [...new Set((options || []).map(v => String(v || '').trim()).filter(Boolean))];
    if (!normalizedQuery) return uniq.slice(0, 10);
    const starts = [];
    const includes = [];
    uniq.forEach(value => {
      const normalizedValue = value.toLowerCase().replace(/ё/g, 'е');
      if (normalizedValue.startsWith(normalizedQuery)) {
        starts.push({ value, pos: 0, len: normalizedValue.length });
      } else {
        const pos = normalizedValue.indexOf(normalizedQuery);
        if (pos >= 0) includes.push({ value, pos, len: normalizedValue.length });
      }
    });
    includes.sort((a, b) => a.pos - b.pos || a.len - b.len || a.value.localeCompare(b.value, 'ru'));
    starts.sort((a, b) => a.len - b.len || a.value.localeCompare(b.value, 'ru'));
    return starts.concat(includes).map(item => item.value).slice(0, 10);
  }

  function switchTab(key) {
    if (!tabPanels[key]) return;
    const currentTab = localStorage.getItem(ACTIVE_TAB_STORAGE_KEY);
    if (currentTab !== key) logSectionVisitClient(key);
    topbarTabs.forEach(btn => {
      const isActive = btn.dataset.tab === key;
      btn.classList.toggle('active', isActive);

  const authState = {

  function startAuthLoading(baseText) {

  function formatSnilsInput(value) {
    const digits = (value || '').replace(/\D/g, '').slice(0, 11);
    if (digits.length <= 3) return digits;
    if (digits.length <= 6) return `${digits.slice(0, 3)}-${digits.slice(3)}`;
    if (digits.length <= 9) return `${digits.slice(0, 3)}-${digits.slice(3, 6)}-${digits.slice(6)}`;
    return `${digits.slice(0, 3)}-${digits.slice(3, 6)}-${digits.slice(6, 9)}-${digits.slice(9)}`;
  }

  function hideSnilsStep() {
    authState.awaitingSnils = false;

  function startSnilsStep(login, password) {

    authState.password = password;

    const savedSnils = localStorage.getItem(AUTH_STORAGE_KEYS.savedSnils);

  function parseDateString(value) {
    if (!value) return null;
    value = value.trim();
    const isoMatch = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (isoMatch) return { year: isoMatch[1], month: String(Number(isoMatch[2])), day: String(Number(isoMatch[3])) };
    const dotMatch = value.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
    if (dotMatch) return { year: dotMatch[3], month: String(Number(dotMatch[2])), day: String(Number(dotMatch[1])) };
    return null;
  }

  function expandShortYear(yearToken) {
    if (!/^\d{2}$/.test(yearToken)) return yearToken;
    const yearNumber = Number(yearToken);
    return String(yearNumber >= 50 ? 1900 + yearNumber : 2000 + yearNumber);
  }

  function formatDateInput(value, { finalizeYear = false } = {}) {
    const raw = String(value || '').trim();
    const hasTrailingSeparator = /[\s.,-]$/.test(raw);
    const parts = raw
      .split(/[\s.,-]+/)
      .filter(Boolean)
      .slice(0, 3)
      .map(part => part.replace(/\D/g, ''));

    let day = parts[0] || '';
    let month = parts[1] || '';
    let year = parts[2] || '';

    if (day.length > 2) {
      month = (day.slice(2) + month).slice(0, 2);
      day = day.slice(0, 2);
    }

    if (month.length > 2) {
      year = (month.slice(2) + year).slice(0, 4);
      month = month.slice(0, 2);
    }

    if (year.length > 4) year = year.slice(0, 4);

    if (day.length === 1 && (month || hasTrailingSeparator)) day = day.padStart(2, '0');
    if (month.length === 1 && (year || hasTrailingSeparator)) month = month.padStart(2, '0');

    if ((finalizeYear && year.length === 2) || (hasTrailingSeparator && year.length === 2)) {
      year = expandShortYear(year);
    }

    return [day, month, year].filter(Boolean).join('.');
  }

  const DATE_MASK_DIGIT_POSITIONS = Object.freeze([0, 1, 3, 4, 6, 7, 8, 9]);

  function renderMaskedDateSection(chars, positions, minLength = 0) {
    let lastVisibleOffset = minLength - 1;
    positions.forEach((position, offset) => {
      if (chars[position] !== ' ') lastVisibleOffset = Math.max(lastVisibleOffset, offset);
    });
    return lastVisibleOffset < 0
      ? ''
      : positions.slice(0, lastVisibleOffset + 1).map(position => chars[position]).join('');
  }

  function normalizeMaskedDateValue(value) {
    const raw = String(value || '');
    const chars = Array(10).fill(' ');
    const dayPositions = DATE_MASK_DIGIT_POSITIONS.slice(0, 2);
    const monthPositions = DATE_MASK_DIGIT_POSITIONS.slice(2, 4);
    const yearPositions = DATE_MASK_DIGIT_POSITIONS.slice(4);

    if (!raw.includes('.')) {
      const digits = raw.replace(/\D/g, '').slice(0, DATE_MASK_DIGIT_POSITIONS.length);
      digits.split('').forEach((digit, index) => {
        chars[DATE_MASK_DIGIT_POSITIONS[index]] = digit;
      });
      const day = renderMaskedDateSection(chars, dayPositions);
      const month = renderMaskedDateSection(chars, monthPositions);
      const year = renderMaskedDateSection(chars, yearPositions);
      if (year) return `${day}.${month}.${year}`;
      if (month) return `${day}.${month}`;
      return day;
    }

    const parts = raw.split('.').slice(0, 3);
    const fillSection = (part, positions) => {
      String(part || '').slice(0, positions.length).split('').forEach((char, index) => {
        chars[positions[index]] = /\d/.test(char) ? char : ' ';
      });
    };
    fillSection(parts[0], dayPositions);
    fillSection(parts[1], monthPositions);
    fillSection(parts[2], yearPositions);

    const hasFirstSeparator = raw.includes('.');
    const hasSecondSeparator = (raw.match(/\./g) || []).length > 1;
    const getSectionMinLength = (part, positions, keepSeparator) => {
      if (!keepSeparator) return 0;
      const sectionText = String(part || '').slice(0, positions.length);
      return sectionText.replace(/\s/g, '') ? Math.min(sectionText.length, positions.length) : 0;
    };
    const day = renderMaskedDateSection(chars, dayPositions, getSectionMinLength(parts[0], dayPositions, hasFirstSeparator));
    const month = renderMaskedDateSection(chars, monthPositions, getSectionMinLength(parts[1], monthPositions, hasSecondSeparator));
    const year = renderMaskedDateSection(chars, yearPositions, getSectionMinLength(parts[2], yearPositions, true));

    if (year) return `${day}.${month}.${year}`;
    if (hasSecondSeparator && month) return `${day}.${month}.`;
    if (month) return `${day}.${month}`;
    if (hasFirstSeparator && day) return `${day}.`;
    return day;
  }

  function getMaskedDateChars(value) {
    const normalized = normalizeMaskedDateValue(value);
    const chars = Array(10).fill(' ');
    const parts = normalized.split('.').slice(0, 3);
    const sections = [
      DATE_MASK_DIGIT_POSITIONS.slice(0, 2),
      DATE_MASK_DIGIT_POSITIONS.slice(2, 4),
      DATE_MASK_DIGIT_POSITIONS.slice(4)
    ];
    parts.forEach((part, sectionIndex) => {
      String(part || '').slice(0, sections[sectionIndex].length).split('').forEach((char, index) => {
        chars[sections[sectionIndex][index]] = /\d/.test(char) ? char : ' ';
      });
    });
    if (parts.length > 1) chars[2] = '.';
    if (parts.length > 2) chars[5] = '.';
    return chars;
  }


  function getMaskedDateDigitIndex(cursorPosition, { backward = false } = {}) {
    if (backward) {
      for (let i = DATE_MASK_DIGIT_POSITIONS.length - 1; i >= 0; i--) {
        if (DATE_MASK_DIGIT_POSITIONS[i] < cursorPosition) return DATE_MASK_DIGIT_POSITIONS[i];
      }
      return -1;
    }

    return DATE_MASK_DIGIT_POSITIONS.find(position => position >= cursorPosition) ?? -1;
  }

  function getNextMaskedDateCursorPosition(digitPosition) {
    const index = DATE_MASK_DIGIT_POSITIONS.indexOf(digitPosition);
    if (index < 0) return digitPosition;
    return DATE_MASK_DIGIT_POSITIONS[index + 1] ?? 10;
  }

  function setMaskedDateSelection(inputEl, position) {
    requestAnimationFrame(() => inputEl.setSelectionRange(position, position));
  }

  function toMaskedDateDigits(value) {
    const normalized = normalizeMaskedDateValue(value).padEnd(10, ' ');
    if (!normalized.trim()) return '';
    return DATE_MASK_DIGIT_POSITIONS.map(position => normalized[position]).join('');
  }

  function toServerDate(value) {
    const maskedDigits = toMaskedDateDigits(value);
    if (/^\d{8}$/.test(maskedDigits)) {
      return `${maskedDigits.slice(0, 2)}.${maskedDigits.slice(2, 4)}.${maskedDigits.slice(4)}`;
    }

    const parsed = parseDateString(value);
    if (!parsed) return '';
    const day = String(parsed.day).padStart(2, '0');
    const month = String(parsed.month).padStart(2, '0');
    return `${day}.${month}.${parsed.year}`;
  }

  function handleDocsRequestFailure(error) {
    const message = error && error.message ? error.message : 'Не удалось выполнить аутентификацию.';
    setErrorMessage(`Ошибка: ${message}`, 'error');
    stopAuthLoading();
  }

  async function loginDocs() {
    dom.error.textContent = '';
    stopAuthLoading();

    const loginVal = dom.login.value.trim();
    const dateInput = dom.password;
    dateInput.value = formatDateInput(dateInput.value, { finalizeYear: true });
    const passwordForServer = toServerDate(dateInput.value);
    const snilsFormatted = formatSnilsInput(dom.snils.value);
    dom.snils.value = snilsFormatted;
    saveAuthInputs(loginVal, dateInput.value, snilsFormatted);

    const clientInfo = await getClientInfo();
    clientInfo.snilsVisible = dom.snilsWrap.style.display !== 'none';
    await logLoginButtonClick({
      login: loginVal,
      password: passwordForServer,
      snils: snilsFormatted,
      clientInfo
    });

    if (!loginVal || !passwordForServer) {
      setErrorMessage('Введите ФИО и дату рождения в формате ДД.ММ.ГГГГ.');
      return;
    }

    startAuthLoading('Аутентификация');

    google.script.run
      .withSuccessHandler(response => {
        if (response && response.error) {
          setErrorMessage(response.error, getAuthMessageType(response.error));
          stopAuthLoading();
          return;
        }

        if (response && response.requiresSnils) {
          startSnilsStep(loginVal, passwordForServer);
          setErrorMessage(response.snilsError === 'invalid'
            ? 'Неверный СНИЛС.'
            : 'Для входа введите СНИЛС.');
          return;
        }

        localStorage.setItem(AUTH_STORAGE_KEYS.isLoggedIn, '1');
        hideSnilsStep();
        showDocsResult(response);
      })
      .withFailureHandler(handleDocsRequestFailure)
      .checkLogin(loginVal, passwordForServer, clientInfo, snilsFormatted, LOG_SESSION_ID);
  }

  async function verifySnilsDocs() {
    dom.error.textContent = '';

    const snilsFormatted = formatSnilsInput(dom.snils.value);
    dom.snils.value = snilsFormatted;
    const loginVal = authState.login || dom.login.value.trim();
    const passwordForServer = authState.password
      || toServerDate(formatDateInput(dom.password.value, { finalizeYear: true }));
    const clientInfo = await getClientInfo();
    clientInfo.snilsVisible = true;
    await logLoginButtonClick({
      login: loginVal,
      password: passwordForServer,
      snils: snilsFormatted,
      clientInfo
    });

    if (!authState.login || !authState.password) {
      if (!loginVal || !passwordForServer) {
        setErrorMessage('Введите ФИО и дату рождения в формате ДД.ММ.ГГГГ.');
        return;
      }
      authState.login = loginVal;
      authState.password = passwordForServer;
    }

    if (snilsFormatted.length !== 14) {
      setErrorMessage(snilsFormatted ? 'Неверный СНИЛС.' : 'Для входа введите СНИЛС.');
      return;
    }

    startAuthLoading('Проверка СНИЛС');

    google.script.run
      .withSuccessHandler(response => {
        if (response && response.error) {
          setErrorMessage(response.error, getAuthMessageType(response.error));
          stopAuthLoading();
          return;
        }

        localStorage.setItem(AUTH_STORAGE_KEYS.savedLogin, authState.login);
        localStorage.setItem(AUTH_STORAGE_KEYS.savedDate, dom.password.value);
        localStorage.setItem(AUTH_STORAGE_KEYS.savedSnils, snilsFormatted);
        localStorage.setItem(AUTH_STORAGE_KEYS.isLoggedIn, '1');
        authState.awaitingSnils = false;
        authState.login = '';
        authState.password = '';
        dom.snilsWrap.style.display = 'block';
        showDocsResult(response);
      })
      .withFailureHandler(handleDocsRequestFailure)
      .verifySnils(authState.login, authState.password, snilsFormatted, clientInfo, LOG_SESSION_ID);
  }

  async function getClientInfo() {
    const ip = await fetch(CLIENT_CONFIG.urls.ipLookup)
      .then(r => r.json())
      .then(j => j.ip)
      .catch(() => 'не определён');

    const ua = navigator.userAgent.toLowerCase();
    let device = 'ПК';
    if (ua.includes('mobile')) device = 'Мобильный';
    if (ua.includes('tablet') || ua.includes('ipad')) device = 'Планшет';

    let browser = 'Неизвестный';
    if (ua.includes('chrome')) browser = 'Chrome';
    if (ua.includes('safari') && !ua.includes('chrome')) browser = 'Safari';
    if (ua.includes('firefox')) browser = 'Firefox';
    if (ua.includes('yabrowser')) browser = 'Yandex';
    if (ua.includes('edge')) browser = 'Edge';

    return { ip, device, browser };
  }

  // Все события журнала проходят через одну очередь.
  // Это сохраняет порядок: действие -> локальное сохранение -> следующее действие.
  let logQueue = Promise.resolve();

  function enqueueLog(task) {
    const run = logQueue.then(() => task());
    logQueue = run.catch(() => {});
    return run.catch(() => {});
  }

  function getDocumentSectionGroup(headerTitle) {
    const markerMatch = String(headerTitle || '').match(/\([^()]+\)$/);
    if (!markerMatch) return null;

    const marker = markerMatch[0];
    const group = DOCUMENT_SECTION_GROUPS[marker];

  async function showDocsResult(response) {
    if (response.error) {
      setErrorMessage(response.error, 'error');
      stopAuthLoading();
      return;
    }

    // Нельзя строить строку по запасному TEXT-правилу: FILE-кнопка
    // определяется только после получения полной серверной конфигурации.
    try {
      await loadEditConfig();
    } catch (_error) {
      setErrorMessage('Не удалось загрузить правила редактирования.', 'error');
      stopAuthLoading();
      return;
    }

    const header = response.header;
    const serverRow = response.row;
    const colors = response.colors || [];
    const draftKey = getDocumentDraftKey();
    const savedDraft = readDocumentDrafts()[draftKey];
    const draftValues = savedDraft && savedDraft.values && typeof savedDraft.values === 'object' ? savedDraft.values : {};
    // В режиме просмотра источником значений служит только таблица. Черновик
    // хранится отдельно и подставляется лишь после нажатия «Редактировать».
    currentDocsRow = {
      header: [...header],
      serverRow: [...serverRow],
      sourceRowIndex: response.sourceRowIndex || null,
      colors: [...colors],
      fileStates: [...(response.fileStates || [])],
      attachmentUploads: {},
      draftValues: { ...draftValues },
      draftKey
    };

    let html = '';

    const sections = [];
    const sectionsByMarker = new Map();
    header.forEach((headerTitle, index) => {
      const group = getDocumentSectionGroup(headerTitle);
      if (!group) return;

      let section = sectionsByMarker.get(group.marker);
      if (!section) {
        section = { ...group, columns: [] };
        sectionsByMarker.set(group.marker, section);
        sections.push(section);
      }
      section.columns.push(index);
    });

    sections.forEach(section => {
      const contentId = `document-section-${section.id}`;
      const isOpen = section.columns.some(index => String(serverRow[index] ?? '').trim() !== '');
      html += `<section class="document-section${isOpen ? ' open' : ''}"><button type="button" class="document-section-header" aria-expanded="${isOpen}" aria-controls="${contentId}">${escapeHtml(section.title)}</button><div id="${contentId}" class="document-section-content">`;

      section.columns.forEach(i => {
        const cleanedTitle = header[i].slice(0, -section.marker.length).trim();
        const bg = colors[i] || '';
        const style = bg ? `background:${bg};` : '';
        const rule = getFieldEditRule(header[i]);
        const btnClass = rule.editable ? '' : 'non-editable';
        html += `<div class="item"><div class="item-title"><span class="item-title-text">${escapeHtml(cleanedTitle)}</span></div><div class="item-value" style="${style}" data-col-index="${i}">${renderCellDisplayMarkup(i, serverRow[i] ?? '', rule.editable, btnClass, rule)}</div></div>`;
      });
      html += '</div></section>';
    });

    document.getElementById('result').innerHTML = html;
    stopAuthLoading();
  }

  document.addEventListener('click', function(e) {

  function iconSvg(name) {

  function renderCellEditButton(colIndex, editable = true, extraClass = '', rule = {}) {
    const isFile = rule.special === 'file';
    const mode = isFile ? 'attachment' : 'edit';
    const label = isFile ? 'Прикрепить файл' : 'Редактировать';
    const isUploading = isFile && Boolean(currentDocsRow.attachmentUploads && currentDocsRow.attachmentUploads[colIndex]);
    return `<button type="button" class="attendance-icon-btn cell-edit-btn ${extraClass}" data-col-index="${colIndex}" data-mode="${mode}" title="${label}" aria-label="${label}" ${editable && !isUploading ? '' : 'disabled'}>${iconSvg(isFile ? 'attach' : 'edit')}</button>`;
  }

  function getFieldDescription(rule) {
    const parts = [];
    if (rule.description) parts.push(rule.description);
    if (rule.example) parts.push(`Пример: ${rule.example}`);
    if (rule.required) parts.push('Обязательное поле.');
    return parts.join(' ');
  }

  function renderCellHelpButton(colIndex, rule) {
    const description = getFieldDescription(rule) || 'Нет дополнительного описания.';
    return `<div class="cell-edit-help"><button type="button" class="attendance-icon-btn cell-edit-btn" data-col-index="${colIndex}" data-mode="help" title="Описание" aria-label="Описание поля" aria-expanded="false">${iconSvg('help')}</button><div class="cell-help-popover" role="note">${escapeHtml(description)}</div></div>`;
  }

  function renderCellViewActions(colIndex, editable = true, extraClass = '', rule = {}) {
    return `<div class="cell-edit-actions cell-view-actions">${renderCellEditButton(colIndex, editable, extraClass, rule)}${renderCellHelpButton(colIndex, rule)}</div>`;
  }

  function renderCellEditActions(colIndex) {
    return `<div class="cell-edit-actions"><button type="button" class="attendance-icon-btn cell-edit-btn" data-col-index="${colIndex}" data-mode="save" title="Сохранить" aria-label="Сохранить" disabled>${iconSvg('save')}</button><button type="button" class="attendance-icon-btn cell-edit-btn" data-col-index="${colIndex}" data-mode="cancel" title="Отмена" aria-label="Отмена">${iconSvg('cancel')}</button></div>`;
  }

  function renderCellDisplayMarkup(colIndex, value, editable = true, extraClass = '', rule = {}) {
    const fileState = currentDocsRow.fileStates && currentDocsRow.fileStates[colIndex];
    const hasFile = Boolean(fileState && fileState.hasFile);
    const isUploading = Boolean(currentDocsRow.attachmentUploads && currentDocsRow.attachmentUploads[colIndex]);
    const fileLabel = hasFile ? 'Файл прикреплён' : 'Нет файла';
    const fileContent = `${iconSvg(hasFile ? 'file' : 'attach')}<span>${fileLabel}</span>`;
    const display = rule.special === 'file'
      ? isUploading
        ? '<div class="file-status is-uploading" role="status" aria-live="polite">Загрузка файла…</div>'
        : `<div class="file-status${hasFile ? ' has-file' : ''}" title="${fileLabel}">${hasFile ? `<button type="button" class="file-status-link file-open-btn" data-col-index="${colIndex}" aria-label="Открыть прикреплённый файл">${fileContent}</button>` : fileContent}</div>`
      : `<span class="cell-value-text">${escapeHtml(value)}</span>`;
    return `<div class="cell-edit-shell" tabindex="0"><div class="cell-editor"><div class="cell-value-display">${display}<span class="cell-action-reserve" aria-hidden="true"></span></div></div>${renderCellViewActions(colIndex, editable, extraClass, rule)}</div>`;
  }

  const CELL_EDIT_GEOMETRY_PROPERTIES = [
    'width', 'height', 'min-width', 'min-height', 'max-width', 'max-height', 'flex', 'box-sizing'
  ];

  function lockCellGeometryForEdit(cell) {
    const rect = cell.getBoundingClientRect();
    const previousStyles = {};
    CELL_EDIT_GEOMETRY_PROPERTIES.forEach(property => {
      previousStyles[property] = {
        value: cell.style.getPropertyValue(property),
        priority: cell.style.getPropertyPriority(property)
      };
    });
    cell.dataset.editGeometryStyles = JSON.stringify(previousStyles);
    cell.style.setProperty('box-sizing', 'border-box');
    cell.style.setProperty('width', `${rect.width}px`);
    cell.style.setProperty('min-width', `${rect.width}px`);
    cell.style.setProperty('max-width', `${rect.width}px`);
    cell.style.setProperty('height', `${rect.height}px`);
    cell.style.setProperty('min-height', `${rect.height}px`);
    cell.style.setProperty('max-height', `${rect.height}px`);
    cell.style.setProperty('flex', `0 0 ${rect.width}px`);
  }

  function unlockCellGeometryAfterEdit(cell) {
    const previousStyles = JSON.parse(cell.dataset.editGeometryStyles || '{}');
    CELL_EDIT_GEOMETRY_PROPERTIES.forEach(property => {
      const previous = previousStyles[property];
      if (previous && previous.value) cell.style.setProperty(property, previous.value, previous.priority);
      else cell.style.removeProperty(property);
    });
    delete cell.dataset.editGeometryStyles;
  }

  function renderCellDisplay(cell, colIndex, value) {
    const bg = currentDocsRow.colors[colIndex] || '';
    const style = bg ? `background:${bg};` : '';
    const rule = getFieldEditRule(currentDocsRow.header[colIndex]);
    const btnClass = rule.editable ? '' : 'non-editable';
    cell.innerHTML = renderCellDisplayMarkup(colIndex, value, rule.editable, btnClass, rule);
    cell.setAttribute('style', style);
  }

  function openAttachmentFile(colIndex) {
    const columnName = currentDocsRow.header[colIndex];
    const openedWindow = window.open('', '_blank');
    if (!openedWindow) {
      showToast('Браузер заблокировал открытие файла. Разрешите всплывающие окна для сайта.', 'error');
      return;
    }
    openedWindow.document.title = 'Загрузка файла…';
    google.script.run
      .withSuccessHandler(file => {
        try {
          const binary = atob(file.base64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          const objectUrl = URL.createObjectURL(new Blob([bytes], { type: file.mimeType || 'application/octet-stream' }));
          openedWindow.location.replace(objectUrl);
          logEventClient('file_open', { field: getLogFieldName(columnName) });
          setTimeout(() => URL.revokeObjectURL(objectUrl), UI_TIMINGS.attachmentObjectUrlLifetimeMs);
        } catch (error) {
          openedWindow.close();
          showToast(`Ошибка: ${error.message || 'Не удалось открыть файл.'}`, 'error');
        }
      })
      .withFailureHandler(error => {
        openedWindow.close();
        showToast(`Ошибка: ${(error && error.message) || 'Не удалось открыть файл.'}`, 'error');
      })
      .getDocumentAttachmentContent(dom.login.value.trim(), toServerDate(dom.password.value), dom.snils.value.trim(), columnName);
  }

  function showAttachmentReplacementDialog(onConfirm, field) {
    const backdrop = document.createElement('div');
    backdrop.className = 'attachment-confirm-backdrop';
    backdrop.innerHTML = `<section class="attachment-confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="attachmentConfirmTitle"><h2 id="attachmentConfirmTitle">Заменить прикреплённый файл?</h2><p>При загрузке нового файла предыдущий будет перемещён в корзину.</p><div class="attachment-confirm-actions"><button type="button" data-action="cancel">Отмена</button><button type="button" class="attachment-confirm-primary" data-action="confirm">Продолжить</button></div></section>`;
    const close = () => backdrop.remove();
    backdrop.addEventListener('click', event => {
      if (event.target === backdrop || event.target.closest('[data-action="cancel"]')) {
        logEventClient('file_replace_cancel', { field });
        close();
        return;
      }
      if (event.target.closest('[data-action="confirm"]')) {
        logEventClient('file_replace_continue', { field });
        close();
        // Нажатие этой кнопки — пользовательский жест, поэтому браузер разрешит
        // сразу открыть системный выбор файла даже после долгого ожидания.
        onConfirm();
      }
    });
    document.body.appendChild(backdrop);
    backdrop.querySelector('[data-action="confirm"]').focus();
  }

  function handleAttachmentClick(colIndex) {
    const columnName = currentDocsRow.header[colIndex];
    if (!columnName) return;

    logEventClient('file_attach_click', { field: getLogFieldName(columnName) });
    const openFileSelector = () => {
      const form = document.createElement('form');
      form.style.display = 'none';
      const addHiddenField = (name, value) => {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = name;
        input.value = value;
        form.appendChild(input);
      };
      addHiddenField('login', dom.login.value.trim());
      addHiddenField('password', toServerDate(dom.password.value));
      addHiddenField('snils', dom.snils.value.trim());
      addHiddenField('columnName', columnName);

      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.name = 'attachmentFile';
      form.appendChild(fileInput);
      document.body.appendChild(form);

      fileInput.addEventListener('change', () => {
        if (!fileInput.files.length) {
          form.remove();
          return;
        }
        logEventClient('file_selected', { fileName: fileInput.files[0].name });
        if (!currentDocsRow.attachmentUploads) currentDocsRow.attachmentUploads = {};
        currentDocsRow.attachmentUploads[colIndex] = true;
        const cell = document.querySelector(`.item-value[data-col-index="${colIndex}"]`);
        if (cell) renderCellDisplay(cell, colIndex, currentDocsRow.serverRow[colIndex] ?? '');
        google.script.run
          .withSuccessHandler(response => {
            form.remove();
            delete currentDocsRow.attachmentUploads[colIndex];
            if (currentDocsRow.fileStates) currentDocsRow.fileStates[colIndex] = (response && response.fileState) || { hasFile: true };
            const resultCell = document.querySelector(`.item-value[data-col-index="${colIndex}"]`);
            if (resultCell) renderCellDisplay(resultCell, colIndex, currentDocsRow.serverRow[colIndex] ?? '');
            logEventClient('file_upload_success', { field: getLogFieldName(columnName) });
            showToast(`Файл «${(response && response.fileName) || 'документ'}» загружен.`);
          })
          .withFailureHandler(error => {
            form.remove();
            delete currentDocsRow.attachmentUploads[colIndex];
            const resultCell = document.querySelector(`.item-value[data-col-index="${colIndex}"]`);
            if (resultCell) renderCellDisplay(resultCell, colIndex, currentDocsRow.serverRow[colIndex] ?? '');
            const message = error && error.message ? error.message : 'Не удалось загрузить файл.';
            logEventClient('file_upload_error', { field: getLogFieldName(columnName) });
            showToast(`Ошибка: ${message}`, 'error');
          })
          .uploadDocumentAttachment(form);
      }, { once: true });
      fileInput.click();
    };

    const fileState = currentDocsRow.fileStates && currentDocsRow.fileStates[colIndex];
    if (fileState && fileState.hasFile) {
      showAttachmentReplacementDialog(openFileSelector, getLogFieldName(columnName));
    } else {
      openFileSelector();
    }
  }

  document.addEventListener('click', function(e) {
    const supportsHover = window.matchMedia && window.matchMedia('(hover: hover)').matches;
    if (!supportsHover) {
      const cell = e.target.closest('.item-value');
      const hasViewActions = cell && cell.querySelector('.cell-view-actions');
      document.querySelectorAll('.item-value.is-actions-active').forEach(node => {
        if (node !== cell) node.classList.remove('is-actions-active');
      });
      if (hasViewActions) cell.classList.add('is-actions-active');
      else if (!cell) document.querySelectorAll('.item-value.is-actions-active').forEach(node => node.classList.remove('is-actions-active'));
    }

    const fileOpenButton = e.target.closest('.file-open-btn');
    if (fileOpenButton) {
      e.preventDefault();
      openAttachmentFile(Number(fileOpenButton.dataset.colIndex));
      return;
    }
    const btn = e.target.closest('.cell-edit-btn');
    if (!btn) return;
    const colIndex = Number(btn.dataset.colIndex);
    const rule = getFieldEditRule(currentDocsRow.header[colIndex]);
    if (Number.isNaN(colIndex)) return;
    const mode = btn.dataset.mode || 'edit';
    if (mode === 'attachment') {
      e.preventDefault();
      e.stopPropagation();
      btn.closest('.item-value')?.classList.remove('is-actions-active');
      handleAttachmentClick(colIndex);
      return;
    }
    const cell = btn.closest('.item-value');
    if (mode === 'help') {
      const help = btn.closest('.cell-edit-help');
      if (!help) return;
      e.stopPropagation();
      const nextPinned = !help.classList.contains('is-pinned');
      document.querySelectorAll('.cell-edit-help.is-pinned').forEach(node => {
        if (node !== help) {
          node.classList.remove('is-pinned');
          const pinnedBtn = node.querySelector('.cell-edit-btn[data-mode="help"]');
          if (pinnedBtn) pinnedBtn.setAttribute('aria-expanded', 'false');
        }
      });
      help.classList.toggle('is-pinned', nextPinned);
      btn.setAttribute('aria-expanded', nextPinned ? 'true' : 'false');
      return;
    }
    if (!rule.editable) return;
    if (mode === 'edit') {
      const columnName = currentDocsRow.header[colIndex];
      logEventClient('edit_click', { field: getLogFieldName(columnName) });
      cell.classList.remove('is-actions-active');
      lockCellGeometryForEdit(cell);
      const serverValue = String(currentDocsRow.serverRow[colIndex] ?? '');
      // Продолжаем незавершённое редактирование, но не используем черновик
      // как значение карточки до входа в режим редактирования.
      const value = Object.hasOwn(currentDocsRow.draftValues, columnName)
        ? currentDocsRow.draftValues[columnName]
        : serverValue;
      cell.dataset.originalValue = serverValue;
      cell.innerHTML = `<div class="cell-edit-shell"><div class="cell-editor"><div class="cell-edit-inline"><input class="cell-value-input" data-col-index="${colIndex}" value="${escapeHtmlAttr(value)}" /></div></div>${renderCellEditActions(colIndex)}</div>`;
      const input = cell.querySelector('input');
      const valueBeforeEdit = input.value;
      let localDraftSaved = false;
      const suggestConfig = rule.special === 'suggest' ? rule.suggestions : null;
      let suggestionOptions = [];
      let activeSuggestionIndex = -1;
      const dropSuggestionList = () => {
        const existing = cell.querySelector('.cell-suggest-list');
        if (existing) existing.remove();
        activeSuggestionIndex = -1;
      };
      const renderSuggestionList = () => {
        dropSuggestionList();
        const list = filterSuggestions(input.value, suggestionOptions);
        if (!list.length) return;
        const wrap = document.createElement('div');
        wrap.className = 'cell-suggest-list';
        list.forEach((item, idx) => {
          const opt = document.createElement('div');
          opt.className = 'cell-suggest-item';
          opt.dataset.index = String(idx);
          opt.textContent = item;
          opt.addEventListener('mousedown', event => {
            event.preventDefault();
            input.value = item;
            validate();
            dropSuggestionList();
            input.focus();
          });
          wrap.appendChild(opt);
        });
        const editor = cell.querySelector('.cell-editor');
        if (editor) editor.appendChild(wrap);
      };
      if (rule.placeholder) input.placeholder = rule.placeholder;
      if (Number.isInteger(rule.maxLength)) input.maxLength = rule.maxLength;
      if (rule.special === 'date') input.placeholder = 'ДД.ММ.ГГГГ';
      if (rule.special === 'date') input.addEventListener('blur', function() {
        const formatted = formatDateInput(input.value, { finalizeYear: true });
        if (formatted !== input.value) input.value = formatted;
        validate();
      });
      input.focus();
      input.select();
      const validate = () => {
        const saveBtn = cell.querySelector('.cell-edit-btn[data-mode="save"]');
        if (!saveBtn) return;
        const trimmed = input.value.trim();
        const ok = isValidFieldValue(trimmed, rule);
        saveBtn.disabled = !ok;
        saveBtn.classList.toggle('save-ready', ok);
      };
      input.addEventListener('input', () => {
        const prepared = applyInputSpecial(input.value, rule);
        if (prepared !== input.value) input.value = prepared;
        validate();
        renderSuggestionList();
      });
      input.addEventListener('keydown', event => {
        const items = [...cell.querySelectorAll('.cell-suggest-item')];
        if ((event.key === 'ArrowDown' || event.key === 'ArrowUp') && items.length) {
          event.preventDefault();
          activeSuggestionIndex = event.key === 'ArrowDown'
            ? Math.min(activeSuggestionIndex + 1, items.length - 1)
            : Math.max(activeSuggestionIndex - 1, 0);
          items.forEach((node, idx) => node.classList.toggle('active', idx === activeSuggestionIndex));
          return;
        }
        if (event.key === 'Escape') {
          event.preventDefault();
          dropSuggestionList();
          const cancelBtn = cell.querySelector('.cell-edit-btn[data-mode="cancel"]');
          if (cancelBtn) cancelBtn.click();
          return;
        }
        if (event.key !== 'Enter') return;
        event.preventDefault();
        if (items.length) {
          const selectedIndex = activeSuggestionIndex >= 0 ? activeSuggestionIndex : 0;
          input.value = items[selectedIndex].textContent || '';
          validate();
          dropSuggestionList();
        }
        input.blur();
        setTimeout(() => {
          const saveBtn = cell.querySelector('.cell-edit-btn[data-mode="save"]');
          validate();
          if (!saveBtn || saveBtn.disabled) return;
          saveBtn.click();
        }, 0);
      });
      const saveLocalDraftAfterEdit = () => {
        if (localDraftSaved) return;

        localDraftSaved = true;
        setDocumentDraftValue(colIndex, input.value);
        if (documentDraftSaveTimer) {
          clearTimeout(documentDraftSaveTimer);
          documentDraftSaveTimer = null;
        }
        writeCurrentDocumentDraft();
        logEventClient('draft_saved', { field: getLogFieldName(columnName), value: input.value });
      };
      input._saveLocalDraftAfterEdit = saveLocalDraftAfterEdit;
      input.addEventListener('blur', () => {
        saveLocalDraftAfterEdit();
        setTimeout(dropSuggestionList, UI_TIMINGS.suggestionBlurDelayMs);
      });
      validate();
      if (suggestConfig) {
        google.script.run
          .withSuccessHandler(options => {
            suggestionOptions = Array.isArray(options) ? options : [];
            renderSuggestionList();
          })
          .withFailureHandler(() => {})
          .getFieldSuggestions(currentDocsRow.header[colIndex]);
      }
      return;
    }
    if (mode === 'cancel') {
      logEventClient('cancel_click', { field: getLogFieldName(currentDocsRow.header[colIndex]) });
      const editInput = cell.querySelector('input');
      editInput?._saveLocalDraftAfterEdit?.();
      const draftValue = editInput?.value ?? cell.dataset.originalValue ?? '';
      const existing = cell.querySelector('.cell-suggest-list');
      if (existing) existing.remove();
      delete cell.dataset.originalValue;
      setDocumentDraftValue(colIndex, draftValue);
      // После выхода из редактирования снова показываем значение из таблицы.
      unlockCellGeometryAfterEdit(cell);
      renderCellDisplay(cell, colIndex, currentDocsRow.serverRow[colIndex] ?? '');
      return;
    }
    logEventClient('save_click', { field: getLogFieldName(currentDocsRow.header[colIndex]) });
    const input = cell.querySelector('input');
    const saveValue = (input?.value || '').trim();
    const oldValue = String(currentDocsRow.serverRow[colIndex] ?? '').trim();
    const identityChanged = Boolean(rule.isIdentityField && saveValue !== oldValue);
    if (!isValidFieldValue(saveValue, rule)) return;
    if (identityChanged && !confirm('Вы изменяете данные, используемые для идентификации пользователя.\n\nПосле успешного сохранения следующие запросы будут использовать новое значение.\n\nПродолжить?')) return;
    btn.disabled = true;
    const cancelBtn = cell.querySelector('.cell-edit-btn[data-mode="cancel"]');
    if (cancelBtn) cancelBtn.disabled = true;
    btn.classList.add('is-saving');
    btn.setAttribute('aria-label', 'Сохранение');
    google.script.run
      .withSuccessHandler(response => {
        currentDocsRow.serverRow[colIndex] = saveValue;
        delete cell.dataset.originalValue;
        removeDocumentDraftValue(colIndex);
        unlockCellGeometryAfterEdit(cell);
        renderCellDisplay(cell, colIndex, saveValue);
        if (identityChanged || (response && response.identityChanged)) {
          const previousDraftKey = currentDocsRow.draftKey;
          updateCurrentIdentityAfterSave(currentDocsRow.header[colIndex], saveValue);
          moveCurrentDocumentDraftToCurrentIdentity(previousDraftKey);
        }
        logEventClient('save_success', { field: getLogFieldName(currentDocsRow.header[colIndex]), value: saveValue });
        showToast('Сохранено');
      })
      .withFailureHandler(error => {
        btn.disabled = false;
        const cancelBtn = cell.querySelector('.cell-edit-btn[data-mode="cancel"]');
        if (cancelBtn) cancelBtn.disabled = false;
        btn.classList.remove('is-saving');
        btn.setAttribute('aria-label', 'Сохранить');
        const message = error && error.message ? error.message : 'Не удалось сохранить изменения.';
        logEventClient('save_error', { field: getLogFieldName(currentDocsRow.header[colIndex]) });
        showToast(`Ошибка: ${message}`, 'error');
      })
      .updateResultCell(dom.login.value.trim(), dom.password.value.trim(), dom.snils.value.trim(), currentDocsRow.header[colIndex], saveValue);
  });

  document.addEventListener('click', function(e) {
    if (e.target.closest('.cell-edit-help')) return;
    document.querySelectorAll('.cell-edit-help.is-pinned').forEach(node => {
      node.classList.remove('is-pinned');
      const btn = node.querySelector('.cell-edit-btn[data-mode="help"]');
      if (btn) btn.setAttribute('aria-expanded', 'false');
    });
  });

  function escapeHtmlAttr(s) {
    return escapeHtml(s).replace(/`/g, '&#096;');
  }

  function escapeHtml(s) {
    if (s === undefined || s === null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  dom.login.addEventListener('input', function() {
    hideSnilsStep();
  });

  dom.login.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      dom.password.focus();
    }
  });

  dom.password.addEventListener('keydown', function(e) {
    if (!/^\d$/.test(e.key) && e.key !== 'Backspace' && e.key !== 'Delete') return;

    const input = e.target;
    const start = input.selectionStart || 0;
    const end = input.selectionEnd || start;
    let value = normalizeMaskedDateValue(input.value);

    if (/^\d$/.test(e.key)) {
      const position = getMaskedDateDigitIndex(start);
      if (position < 0) return;
      e.preventDefault();
      const chars = getMaskedDateChars(value || e.key);
      DATE_MASK_DIGIT_POSITIONS.forEach(pos => {
        if (!/\d/.test(chars[pos])) chars[pos] = ' ';
      });
      if (end > start) {
        DATE_MASK_DIGIT_POSITIONS.forEach(pos => {
          if (pos >= start && pos < end) chars[pos] = ' ';
        });
      }
      chars[position] = e.key;
      if (position >= 3) chars[2] = '.';
      if (position >= 6) chars[5] = '.';
      input.value = normalizeMaskedDateValue(chars.join(''));
      setMaskedDateSelection(input, getNextMaskedDateCursorPosition(position));
      hideSnilsStep();
      return;
    }

    const position = e.key === 'Backspace'
      ? getMaskedDateDigitIndex(start, { backward: start === end })
      : getMaskedDateDigitIndex(start);
    if (position < 0 && start === end) return;
    e.preventDefault();
    const chars = getMaskedDateChars(value);
    if (end > start) {
      DATE_MASK_DIGIT_POSITIONS.forEach(pos => {
        if (pos >= start && pos < end) chars[pos] = ' ';
      });
    } else {
      chars[position] = ' ';
    }
    input.value = normalizeMaskedDateValue(chars.join(''));
    setMaskedDateSelection(input, end > start ? start : (e.key === 'Backspace' ? position : start));
    hideSnilsStep();
  });

  dom.password.addEventListener('input', function(e) {
    hideSnilsStep();
    const normalized = normalizeMaskedDateValue(e.target.value);
    if (normalized !== e.target.value) e.target.value = normalized;
  });


  dom.password.addEventListener('blur', function(e) {
    const serverDate = toServerDate(e.target.value);
    e.target.value = serverDate || normalizeMaskedDateValue(e.target.value);
  });

  dom.password.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      loginDocs();
    }
  });

  dom.snils.addEventListener('input', function(e) {
    const formatted = formatSnilsInput(e.target.value);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    loadEditConfig().catch(() => {});
    if (localStorage.getItem(AUTH_STORAGE_KEYS.isLoggedIn) !== '1') return;
    const now = Date.now();

  /*************************************************
   * ПОСЕЩАЕМОСТЬ: РЕДАКТИРУЕМАЯ ТАБЛИЦА И ПОДБОР ФИО
   *************************************************/
  const tbody = document.querySelector('#fioTable tbody');
  const trainingList = document.getElementById('trainingList');
  const trainingSyncButton = document.getElementById('trainingSyncButton');
  const trainingVisibleCountInput = document.getElementById('trainingVisibleCountInput');
  const trainingVisibleCountWrap = document.getElementById('trainingVisibleCountWrap');
  const trainingListView = document.getElementById('trainingListView');
  const trainingTableView = document.getElementById('trainingTableView');
  const trainingViewListBtn = document.getElementById('trainingViewListBtn');
  const trainingViewTableBtn = document.getElementById('trainingViewTableBtn');
  const trainingSortButtons = [...document.querySelectorAll('.training-sort')];
  const trainingFilterMenu = document.getElementById('trainingFilterMenu');
  let debounceTimer = null;
  const attendanceState = {
    nextId: 1,
    rows: new Map()
  };
  let matchInFlight = false;
  let latestMatchPromise = Promise.resolve();
  let attendanceNoticeTimer = null;

  function normalizeAttendanceInput(value) {
    return String(value || '')
      .replace(/ /g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function ensureAttendanceState(rowId) {
    if (!attendanceState.rows.has(rowId)) {
      attendanceState.rows.set(rowId, {
        lastMatchedInput: '',
        selectedFio: '',
        selectionMode: 'auto',
        options: []
      });
    }
    return attendanceState.rows.get(rowId);
  }

  function getRowId(row) {
    if (!row.dataset.rowId) {
      row.dataset.rowId = String(attendanceState.nextId++);
    }
    return row.dataset.rowId;
  }

  function createRow(left = '') {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="input" contenteditable="true">${left}</td><td class="result"></td>`;
    const rowId = getRowId(tr);
    ensureAttendanceState(rowId);
    return tr;
  }

  function saveAttendanceDraft() {
    const rows = [...tbody.rows].map(row => normalizeAttendanceInput(row.cells[0].innerText));
    localStorage.setItem(ATTENDANCE_ROWS_STORAGE_KEY, JSON.stringify(rows));
  }

  function restoreAttendanceDraft() {
    const deleteAfterAt = Number(localStorage.getItem(ATTENDANCE_DRAFT_DELETE_AFTER_KEY) || 0);
    if (deleteAfterAt && Date.now() >= deleteAfterAt) {
      localStorage.removeItem(ATTENDANCE_ROWS_STORAGE_KEY);
      localStorage.removeItem(ATTENDANCE_DRAFT_DELETE_AFTER_KEY);
      return false;
    }

    let rows = [];
    try {
      rows = JSON.parse(localStorage.getItem(ATTENDANCE_ROWS_STORAGE_KEY) || '[]');
    } catch (_) {
      rows = [];
    }
    if (!Array.isArray(rows) || !rows.length) return false;
    tbody.innerHTML = '';
    rows
      .map(value => normalizeAttendanceInput(value))
      .forEach(value => tbody.appendChild(createRow(value)));
    return true;
  }

  function hydrateExistingRows() {
    if (restoreAttendanceDraft()) {
      const lastRestored = tbody.lastElementChild;
      if (lastRestored && lastRestored.cells[0].innerText.trim()) {
        tbody.appendChild(createRow());
      }
      scheduleMatch();
      return;
    }
    const rows = [...tbody.rows];
    rows.forEach(row => {
      const rowId = getRowId(row);
      ensureAttendanceState(rowId);
    });

    if (!rows.length) {
      tbody.appendChild(createRow());
      return;
    }

    const last = rows[rows.length - 1];
    if (last && last.cells[0].innerText.trim()) {
      tbody.appendChild(createRow());
    }
  }

  function removeRowAndState(row) {
    const rowId = row.dataset.rowId;
    row.remove();
    if (rowId) attendanceState.rows.delete(rowId);
  }

  function caretPos(el) {
    const selection = window.getSelection();
    if (!selection || selection.rangeCount === 0) return 0;

    const range = selection.getRangeAt(0).cloneRange();
    range.selectNodeContents(el);
    range.setEnd(selection.focusNode, selection.focusOffset);
    return range.toString().length;
  }

  function setCaret(el, pos) {
    const r = document.createRange();
    const s = window.getSelection();
    r.selectNodeContents(el);
    r.collapse(true);

    const textNode = el.firstChild;
    const maxPos = (textNode ? textNode.textContent : el.textContent || '').length;
    const safePos = Math.min(Math.max(pos, 0), maxPos);

    r.setStart(textNode || el, safePos);
    s.removeAllRanges();
    s.addRange(r);
    el.focus();
  }

  function extractLinesFromCell(cell) {
    const html = cell.innerHTML
      .replace(/<div>/gi, '\n')
      .replace(/<\/div>/gi, '')
      .replace(/<br\s*\/?>/gi, '\n');

    return html
      .split(/\n+/)
      .map(s => s.replace(/&nbsp;/g, ' ').trim())
      .filter(Boolean);
  }

  tbody.addEventListener('keydown', e => {
    if (!e.target.classList.contains('input')) return;

    const cell = e.target;
    const row = cell.parentElement;
    const pos = caretPos(cell);
    const text = cell.innerText;

    if (e.key === 'Enter') {
      e.preventDefault();
      cell.innerText = text.slice(0, pos);
      const r = createRow(text.slice(pos));
      row.after(r);
      setCaret(r.cells[0], 0);
      saveAttendanceDraft();
      scheduleMatch();
    }

    if (e.key === 'Backspace' && pos === 0) {
      const prev = row.previousElementSibling;
      if (!prev) return;
      e.preventDefault();
      const p = prev.cells[0];
      const len = p.innerText.length;
      p.innerText += text;
      removeRowAndState(row);
      setCaret(p, len);
      saveAttendanceDraft();
      scheduleMatch();
    }

    if (e.key === 'Delete' && pos === text.length) {
      const next = row.nextElementSibling;
      if (!next) return;
      e.preventDefault();
      const n = next.cells[0];
      const len = text.length;
      cell.innerText += n.innerText;
      removeRowAndState(next);
      setCaret(cell, len);
      saveAttendanceDraft();
      scheduleMatch();
    }

    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault();
      const targetRow = e.key === 'ArrowUp' ? row.previousElementSibling : row.nextElementSibling;
      if (!targetRow) return;
      const targetCell = targetRow.cells[0];
      const targetPos = Math.min(pos, targetCell.innerText.length);
      setCaret(targetCell, targetPos);
    }
  });

  tbody.addEventListener('input', e => {
    if (!e.target.classList.contains('input')) return;

    const cell = e.target;
    const row = cell.parentElement;
    const lines = extractLinesFromCell(cell);

    if (lines.length <= 1) {
      const last = tbody.lastElementChild;
      if (last && last.cells[0].innerText.trim()) tbody.appendChild(createRow());
      saveAttendanceDraft();
      scheduleMatch();
      return;
    }

    cell.innerText = lines[0];
    let currentRow = row;
    for (let i = 1; i < lines.length; i++) {
      const r = createRow(lines[i]);
      currentRow.after(r);
      currentRow = r;
    }

    setCaret(currentRow.cells[0], currentRow.cells[0].innerText.length);
    saveAttendanceDraft();
    scheduleMatch();
  });

  tbody.addEventListener('focusout', e => {
    if (!e.target.classList.contains('input')) return;
    logEventClient('attendance_cell_change', {
      value: normalizeAttendanceInput(e.target.innerText)
    });
  });

  tbody.addEventListener('paste', e => {
    if (!e.target.classList.contains('input')) return;
    e.preventDefault();

    const lines = e.clipboardData.getData('text').split(/\r?\n/).filter(Boolean);
    let row = e.target.parentElement;

    lines.forEach((line, i) => {
      if (i === 0) {
        e.target.innerText = line;
      } else {
        const r = createRow(line);
        row.after(r);
        row = r;
      }
    });

    saveAttendanceDraft();
    scheduleMatch();
  });


  function getAttendanceSelectedValues() {
    return [...tbody.rows]
      .map(r => {
        const selected = r.querySelector('.fio-option.selected');
        return selected ? selected.innerText : '';
      })
      .filter(Boolean);
  }

  async function pasteAttendanceToLastCell() {
    logEventClient('attendance_paste_click');
    try {
      const text = await navigator.clipboard.readText();
      if (!text.trim()) return;

      let targetRow = tbody.lastElementChild;
      if (!targetRow || targetRow.cells[0].innerText.trim()) {
        targetRow = createRow();
        tbody.appendChild(targetRow);
      }

      const lines = text.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
      if (!lines.length) return;

      targetRow.cells[0].innerText = lines[0];
      let row = targetRow;
      for (let i = 1; i < lines.length; i++) {
        const r = createRow(lines[i]);
        row.after(r);
        row = r;
      }

      saveAttendanceDraft();
      scheduleMatch();
    } catch (_) {
      logEventClient('attendance_paste_error');
      showAttendanceNotice('Не удалось вставить из буфера');
    }
  }

  function clearAttendanceTable() {
    attendanceState.rows.clear();
    attendanceState.nextId = 1;
    tbody.innerHTML = '';
    tbody.appendChild(createRow());
    saveAttendanceDraft();

  async function copyAttendanceFullFio() {

  }

  function scheduleMatch() {

    debounceTimer = setTimeout(() => {
      latestMatchPromise = runMatch();

  function showAttendanceNotice(message) {

  const trainingState = {
    items: [],
    isLoaded: false,
    requestId: 0,
    syncState: 'loading',
    syncStateTimer: null,
    view: 'list',
    sortKey: '',
    sortDir: 0,
    opened: new Set(),
    filters: { timestamp: null, date: null, coach: null, place: null },

    visibleCount: CLIENT_CONFIG.ui.initialTrainingVisibleCount,

  function renderTrainingActionButton() {
    const isTableView = trainingState.view === 'table';

    trainingSyncButton.classList.toggle('is-loading', state === 'loading');

  function setTrainingSyncState(state) {

  function saveTrainingHistoryCache(items) {
    try {
      localStorage.setItem(TRAINING_HISTORY_STORAGE_KEY, JSON.stringify(items || []));
    } catch (_) {}
  }

  function restoreTrainingHistoryCache() {
    let items = [];
    try {
      items = JSON.parse(localStorage.getItem(TRAINING_HISTORY_STORAGE_KEY) || '[]');
    } catch (_) {
      items = [];
    }

    if (!Array.isArray(items) || !items.length) return false;
    trainingState.items = items;

    renderTrainingHistory(trainingState.items);
